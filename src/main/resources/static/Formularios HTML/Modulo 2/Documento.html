<!DOCTYPE html>
<html lang="es">

<head>
    <script src="/JS/api-client.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de documentos - My Pet</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff7ed, #fef3c7);
            padding: 30px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
        }

        /* ENCABEZADO */

        .encabezado {
            background: linear-gradient(135deg, #ff8a3d, #ffb347);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }

        .logo {
            font-size: 45px;
        }

        .encabezado h1 {
            font-size: 32px;
            margin: 8px 0;
        }

        .encabezado p {
            font-size: 15px;
        }

        /* CONTENIDO */

        .contenido {
            background: white;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .seccion {
            margin-bottom: 40px;
        }

        .titulo {
            font-size: 22px;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        /* FORMULARIO */

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-weight: bold;
            color: #444;
            margin-bottom: 7px;
        }

        .campo input,
        .campo select {

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            background-color: #fafafa;
        }

        .campo input:focus,
        .campo select:focus {

            border-color: #ff8a3d;

            background-color: white;

            box-shadow:
                0 0 0 3px
                rgba(255, 138, 61, 0.12);
        }

        /* BOTONES */

        .botones {

            grid-column: 1 / 3;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        button {

            border: none;

            padding: 12px 20px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;

            transition: 0.2s;
        }

        button:hover {

            opacity: 0.85;

            transform: translateY(-1px);
        }

        .btn-principal {

            background: #ff8a3d;

            color: white;
        }

        .btn-buscar {

            background: #6c5ce7;

            color: white;
        }

        .btn-eliminar {

            background: #e74c3c;

            color: white;
        }

        .btn-secundario {

            background: #777;

            color: white;
        }

        /* BUSQUEDA */

        .busqueda {

            display: flex;

            gap: 10px;

            margin-bottom: 15px;
        }

        .busqueda input {

            flex: 1;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;
        }

        /* TABLA */

        .tabla-contenedor {

            overflow-x: auto;

            margin-top: 20px;

            display: none;
        }

        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 850px;
        }

        th {

            background: #ff8a3d;

            color: white;

            padding: 12px;

            text-align: left;
        }

        td {

            padding: 11px;

            border-bottom: 1px solid #eee;
        }

        tr:hover {

            background-color: #fff7ed;
        }

        /* RESULTADO */

        .resultado {

            margin-top: 20px;

            padding: 20px;

            background: #fff7ed;

            border-radius: 10px;

            border-left: 4px solid #ff8a3d;

            display: none;
        }

        .resultado p {

            margin-bottom: 8px;

            color: #444;
        }

        /* MENSAJES */

        .mensaje {

            padding: 12px;

            margin-top: 20px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;

            display: none;
        }

        .exito {

            display: block;

            background: #dcfce7;

            color: #166534;
        }

        .error {

            display: block;

            background: #fee2e2;

            color: #991b1b;
        }

        /* PIE */

        .pie {

            background: #fafafa;

            padding: 18px;

            text-align: center;

            color: #777;

            border-radius: 0 0 20px 20px;
        }

        /* RESPONSIVE */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .botones {
                grid-column: 1;
            }

            .busqueda {
                flex-direction: column;
            }

            .encabezado h1 {
                font-size: 26px;
            }

        }

    </style>

</head>

<body>

<div class="contenedor">

    <!-- ENCABEZADO -->

    <div class="encabezado">

        <div class="logo">
            🐾
        </div>

        <h1>
            My Pet
        </h1>

        <p>
            Gestión de documentos
        </p>

    </div>


    <div class="contenido">


        <!-- REGISTRAR DOCUMENTO -->

        <section class="seccion">

            <h2 class="titulo">
                Registrar documento
            </h2>


            <form
                id="formDocumento"
                class="formulario"
            >


                <div class="campo">

                    <label for="tipoDocumento">
                        Tipo de documento
                    </label>

                    <select
                        id="tipoDocumento"
                        required
                    >

                        <option value="">
                            Seleccione una opción
                        </option>

                        <option value="Documento medico">
                            Documento médico
                        </option>

                        <option value="Documento general">
                            Documento general
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="archivo">
                        Nombre o ruta del archivo
                    </label>

                    <input
                        type="text"
                        id="archivo"
                        placeholder="Ejemplo: certificado_vacunacion.pdf"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="idUsuario">
                        ID del usuario
                    </label>

                    <input
                        type="number"
                        id="idUsuario"
                        min="1"
                        placeholder="Ingrese el ID del usuario"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="idMascota">
                        ID de la mascota
                    </label>

                    <input
                        type="number"
                        id="idMascota"
                        min="1"
                        placeholder="Ingrese el ID de la mascota"
                        required
                    >

                </div>


                <div class="botones">

                    <button
                        type="submit"
                        class="btn-principal"
                    >
                        Registrar documento
                    </button>

                </div>

            </form>


            <p
                id="mensajeRegistro"
                class="mensaje"
            ></p>

        </section>


        <!-- LISTAR DOCUMENTOS -->

        <section class="seccion">

            <h2 class="titulo">
                Documentos registrados
            </h2>


            <button
                onclick="listarDocumentos()"
                class="btn-principal"
            >
                Listar documentos
            </button>


            <button
                onclick="ocultarTabla()"
                class="btn-secundario"
            >
                Ocultar tabla
            </button>


            <div
                id="listaDocumentos"
                class="tabla-contenedor"
            ></div>

        </section>


        <!-- BUSCAR POR USUARIO -->

        <section class="seccion">

            <h2 class="titulo">
                Buscar documentos por usuario
            </h2>


            <div class="busqueda">

                <input
                    type="number"
                    id="idUsuarioBuscar"
                    min="1"
                    placeholder="Ingrese el ID del usuario"
                >

                <button
                    onclick="buscarPorUsuario()"
                    class="btn-buscar"
                >
                    Buscar
                </button>

            </div>


            <div
                id="resultadoUsuario"
                class="resultado"
            ></div>

        </section>


        <!-- BUSCAR POR MASCOTA -->

        <section class="seccion">

            <h2 class="titulo">
                Buscar documentos por mascota
            </h2>


            <div class="busqueda">

                <input
                    type="number"
                    id="idMascotaBuscar"
                    min="1"
                    placeholder="Ingrese el ID de la mascota"
                >

                <button
                    onclick="buscarPorMascota()"
                    class="btn-buscar"
                >
                    Buscar
                </button>

            </div>


            <div
                id="resultadoMascota"
                class="resultado"
            ></div>

        </section>


        <!-- ELIMINAR DOCUMENTO -->

        <section class="seccion">

            <h2 class="titulo">
                Eliminar documento
            </h2>


            <div class="busqueda">

                <input
                    type="number"
                    id="idEliminar"
                    min="1"
                    placeholder="Ingrese el ID del documento"
                >

                <button
                    onclick="eliminarDocumento()"
                    class="btn-eliminar"
                >
                    Eliminar documento
                </button>

            </div>


            <p
                id="mensajeEliminar"
                class="mensaje"
            ></p>

        </section>


    </div>


    <!-- PIE -->

    <div class="pie">

        My Pet © 2026 · Gestión de documentos

    </div>

</div>


<script>

const URL_API =
    "http://localhost:8082/api/documentos";


// ==========================================
// REGISTRAR DOCUMENTO
// POST /api/documentos/guardar
// ==========================================

document
    .getElementById("formDocumento")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const documento = {

            tipoDocumento:
                document.getElementById(
                    "tipoDocumento"
                ).value,

            archivo:
                document.getElementById(
                    "archivo"
                ).value,

            usuario: {

                idUsuario:
                    parseInt(
                        document.getElementById(
                            "idUsuario"
                        ).value
                    )

            },

            mascota: {

                idMascota:
                    parseInt(
                        document.getElementById(
                            "idMascota"
                        ).value
                    )

            }

        };


        fetch(
            URL_API + "/guardar",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(documento)

            }
        )


        .then(response => {

            if (!response.ok) {

                return response.text()
                    .then(mensaje => {

                        throw new Error(
                            mensaje ||
                            "No fue posible registrar el documento."
                        );

                    });

            }

            return response.json();

        })


        .then(data => {

            const mensaje =
                document.getElementById(
                    "mensajeRegistro"
                );


            mensaje.textContent =
                "Documento registrado correctamente. ID generado: "
                + data.idDocumento;


            mensaje.className =
                "mensaje exito";


            document
                .getElementById("formDocumento")
                .reset();

        })


        .catch(error => {

            const mensaje =
                document.getElementById(
                    "mensajeRegistro"
                );


            mensaje.textContent =
                "Error: " + error.message;


            mensaje.className =
                "mensaje error";

        });

});


// ==========================================
// LISTAR DOCUMENTOS
// GET /api/documentos/listar
// ==========================================

function listarDocumentos() {

    const tabla =
        document.getElementById(
            "listaDocumentos"
        );


    fetch(
        URL_API + "/listar"
    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "No fue posible consultar los documentos."
            );

        }

        return response.json();

    })


    .then(documentos => {

        let contenido = "";


        if (documentos.length === 0) {

            contenido =
                "<p>No hay documentos registrados.</p>";

        }

        else {

            contenido = `

                <table>

                    <tr>

                        <th>ID documento</th>

                        <th>Tipo</th>

                        <th>Archivo</th>

                        <th>ID usuario</th>

                        <th>ID mascota</th>

                        <th>Nombre de la mascota</th>

                    </tr>

            `;


            documentos.forEach(documento => {

                contenido += `

                    <tr>

                        <td>
                            ${documento.idDocumento}
                        </td>

                        <td>
                            ${documento.tipoDocumento || ""}
                        </td>

                        <td>
                            ${documento.archivo || ""}
                        </td>

                        <td>
                            ${
                                documento.usuario
                                ? documento.usuario.idUsuario
                                : ""
                            }
                        </td>

                        <td>
                            ${
                                documento.mascota
                                ? documento.mascota.idMascota
                                : ""
                            }
                        </td>

                        <td>
                            ${
                                documento.mascota
                                ? documento.mascota.nombre
                                : ""
                            }
                        </td>

                    </tr>

                `;

            });


            contenido += "</table>";

        }


        tabla.innerHTML =
            contenido;


        tabla.style.display =
            "block";

    })


    .catch(error => {

        tabla.innerHTML =
            "<p>Error: "
            + error.message
            + "</p>";


        tabla.style.display =
            "block";

    });

}


// ==========================================
// OCULTAR TABLA
// ==========================================

function ocultarTabla() {

    document
        .getElementById(
            "listaDocumentos"
        )
        .style.display = "none";

}


// ==========================================
// BUSCAR POR USUARIO
// GET /api/documentos/usuario/{idUsuario}
// ==========================================

function buscarPorUsuario() {

    const id =
        document.getElementById(
            "idUsuarioBuscar"
        ).value;


    const resultado =
        document.getElementById(
            "resultadoUsuario"
        );


    if (!id) {

        resultado.style.display =
            "block";

        resultado.innerHTML =
            "<p>Ingrese el ID del usuario.</p>";

        return;

    }


    fetch(
        URL_API + "/usuario/" + id
    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "No se encontraron documentos para este usuario."
            );

        }

        return response.json();

    })


    .then(documentos => {

        resultado.style.display =
            "block";


        if (documentos.length === 0) {

            resultado.innerHTML =
                "<p>El usuario no tiene documentos registrados.</p>";

            return;

        }


        let contenido = `

            <table>

                <tr>

                    <th>ID documento</th>

                    <th>Tipo</th>

                    <th>Archivo</th>

                    <th>ID mascota</th>

                    <th>Nombre de la mascota</th>

                </tr>

        `;


        documentos.forEach(documento => {

            contenido += `

                <tr>

                    <td>
                        ${documento.idDocumento}
                    </td>

                    <td>
                        ${documento.tipoDocumento || ""}
                    </td>

                    <td>
                        ${documento.archivo || ""}
                    </td>

                    <td>
                        ${
                            documento.mascota
                            ? documento.mascota.idMascota
                            : ""
                        }
                    </td>

                    <td>
                        ${
                            documento.mascota
                            ? documento.mascota.nombre
                            : ""
                        }
                    </td>

                </tr>

            `;

        });


        contenido += "</table>";


        resultado.innerHTML =
            contenido;

    })


    .catch(error => {

        resultado.style.display =
            "block";


        resultado.innerHTML =
            "<p>Error: "
            + error.message
            + "</p>";

    });

}


// ==========================================
// BUSCAR POR MASCOTA
// GET /api/documentos/mascota/{idMascota}
// ==========================================

function buscarPorMascota() {

    const id =
        document.getElementById(
            "idMascotaBuscar"
        ).value;


    const resultado =
        document.getElementById(
            "resultadoMascota"
        );


    if (!id) {

        resultado.style.display =
            "block";

        resultado.innerHTML =
            "<p>Ingrese el ID de la mascota.</p>";

        return;

    }


    fetch(
        URL_API + "/mascota/" + id
    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "No se encontraron documentos para esta mascota."
            );

        }

        return response.json();

    })


    .then(documentos => {

        resultado.style.display =
            "block";


        if (documentos.length === 0) {

            resultado.innerHTML =
                "<p>La mascota no tiene documentos registrados.</p>";

            return;

        }


        let contenido = `

            <table>

                <tr>

                    <th>ID documento</th>

                    <th>Tipo</th>

                    <th>Archivo</th>

                    <th>ID mascota</th>

                    <th>Nombre de la mascota</th>

                </tr>

        `;


        documentos.forEach(documento => {

            contenido += `

                <tr>

                    <td>
                        ${documento.idDocumento}
                    </td>

                    <td>
                        ${documento.tipoDocumento || ""}
                    </td>

                    <td>
                        ${documento.archivo || ""}
                    </td>

                    <td>
                        ${
                            documento.mascota
                            ? documento.mascota.idMascota
                            : id
                        }
                    </td>

                    <td>
                        ${
                            documento.mascota
                            ? documento.mascota.nombre
                            : ""
                        }
                    </td>

                </tr>

            `;

        });


        contenido += "</table>";


        resultado.innerHTML =
            contenido;

    })


    .catch(error => {

        resultado.style.display =
            "block";


        resultado.innerHTML =
            "<p>Error: "
            + error.message
            + "</p>";

    });

}


// ==========================================
// ELIMINAR DOCUMENTO
// DELETE /api/documentos/eliminar/{id}
// ==========================================

function eliminarDocumento() {

    const id =
        document.getElementById(
            "idEliminar"
        ).value;


    const mensaje =
        document.getElementById(
            "mensajeEliminar"
        );


    if (!id) {

        mensaje.textContent =
            "Ingrese el ID del documento.";

        mensaje.className =
            "mensaje error";

        return;

    }


    const confirmar =
        confirm(
            "¿Está seguro de eliminar el documento con ID "
            + id
            + "?"
        );


    if (!confirmar) {

        return;

    }


    fetch(
        URL_API + "/eliminar/" + id,
        {

            method: "DELETE"

        }
    )


    .then(response => {

        if (!response.ok) {

            return response.text()
                .then(mensajeError => {

                    throw new Error(
                        mensajeError ||
                        "No fue posible eliminar el documento."
                    );

                });

        }

        return response.text();

    })


    .then(data => {

        mensaje.textContent =
            data ||
            "Documento eliminado correctamente.";

        mensaje.className =
            "mensaje exito";

    })


    .catch(error => {

        mensaje.textContent =
            "Error: " + error.message;

        mensaje.className =
            "mensaje error";

    });

}

</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const idMascota = new URLSearchParams(window.location.search).get("idMascota");
    if (!idMascota) return;

    let idUsuario = null;
    try {
        const usuario = JSON.parse(localStorage.getItem("usuarioLogueado") || "null");
        idUsuario = usuario && (usuario.idUsuario || usuario.id_usuario);
    } catch (error) {
        console.error("No se pudo leer el usuario actual:", error);
    }

    const campoMascota = document.getElementById("idMascota");
    const campoMascotaBuscar = document.getElementById("idMascotaBuscar");
    const campoUsuario = document.getElementById("idUsuario");
    if (campoMascota) campoMascota.value = idMascota;
    if (campoMascotaBuscar) campoMascotaBuscar.value = idMascota;
    if (campoUsuario && idUsuario) campoUsuario.value = idUsuario;
    if (typeof buscarPorMascota === "function") buscarPorMascota();
});
</script>
</body>

</html>
