<!DOCTYPE html>
<html lang="es">

<head>
    <script src="/JS/api-client.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de perfiles de mascota - My Pet</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff7ed, #fef3c7);
            padding: 30px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
        }

        /* ==============================
           ENCABEZADO
        ============================== */

        .encabezado {
            background: linear-gradient(135deg, #ff8a3d, #ffb347);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }

        .logo {
            font-size: 45px;
        }

        .encabezado h1 {
            font-size: 32px;
            margin: 8px 0;
        }

        .encabezado p {
            font-size: 15px;
        }

        /* ==============================
           CONTENIDO
        ============================== */

        .contenido {
            background: white;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .seccion {
            margin-bottom: 40px;
        }

        .titulo {
            font-size: 22px;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        /* ==============================
           FORMULARIOS
        ============================== */

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo.completo {
            grid-column: 1 / 3;
        }

        .campo label {
            font-weight: bold;
            color: #444;
            margin-bottom: 7px;
        }

        .campo input,
        .campo textarea {

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            background-color: #fafafa;
        }

        .campo input:focus,
        .campo textarea:focus {

            border-color: #ff8a3d;

            background-color: white;

            box-shadow:
                0 0 0 3px
                rgba(255, 138, 61, 0.12);
        }

        .campo textarea {

            min-height: 100px;

            resize: vertical;
        }

        /* ==============================
           BOTONES
        ============================== */

        .botones {

            grid-column: 1 / 3;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        button {

            border: none;

            padding: 12px 20px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;

            transition: 0.2s;
        }

        button:hover {

            opacity: 0.85;

            transform: translateY(-1px);
        }

        .btn-principal {

            background: #ff8a3d;

            color: white;
        }

        .btn-buscar {

            background: #6c5ce7;

            color: white;
        }

        .btn-actualizar {

            background: #3498db;

            color: white;
        }

        .btn-eliminar {

            background: #e74c3c;

            color: white;
        }

        .btn-secundario {

            background: #777;

            color: white;
        }

        /* ==============================
           BUSQUEDA
        ============================== */

        .busqueda {

            display: flex;

            gap: 10px;
        }

        .busqueda input {

            flex: 1;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;
        }

        .busqueda input:focus {

            border-color: #ff8a3d;

            box-shadow:
                0 0 0 3px
                rgba(255, 138, 61, 0.12);
        }

        /* ==============================
           RESULTADO
        ============================== */

        .resultado {

            margin-top: 20px;

            padding: 20px;

            background: #fff7ed;

            border-radius: 10px;

            border-left: 4px solid #ff8a3d;
        }

        .resultado p {

            margin-bottom: 8px;

            color: #444;
        }

        /* ==============================
           TABLA
        ============================== */

        .tabla-contenedor {

            overflow-x: auto;

            margin-top: 20px;

            display: none;
        }

        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 850px;
        }

        th {

            background: #ff8a3d;

            color: white;

            padding: 12px;

            text-align: left;
        }

        td {

            padding: 11px;

            border-bottom: 1px solid #eee;
        }

        tr:hover {

            background-color: #fff7ed;
        }

        /* ==============================
           MENSAJES
        ============================== */

        .mensaje {

            padding: 12px;

            margin-top: 20px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;

            display: none;
        }

        .exito {

            display: block;

            background: #dcfce7;

            color: #166534;
        }

        .error {

            display: block;

            background: #fee2e2;

            color: #991b1b;
        }

        /* ==============================
           PIE
        ============================== */

        .pie {

            background: #fafafa;

            padding: 18px;

            text-align: center;

            color: #777;

            border-radius: 0 0 20px 20px;
        }

        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .campo.completo {
                grid-column: 1;
            }

            .botones {
                grid-column: 1;
            }

            .busqueda {
                flex-direction: column;
            }

            .encabezado h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="contenedor">


    <!-- ==============================
         ENCABEZADO
    ============================== -->

    <div class="encabezado">

        <div class="logo">
            🐾
        </div>

        <h1>
            My Pet
        </h1>

        <p>
            Gestión de perfiles de mascota
        </p>

    </div>


    <div class="contenido">


        <!-- ==============================
             CREAR PERFIL
        ============================== -->

        <section class="seccion">

            <h2 class="titulo">
                Crear perfil de mascota
            </h2>


            <form
                id="formPerfilMascota"
                class="formulario"
            >


                <!-- ID MASCOTA -->

                <div class="campo">

                    <label for="idMascota">
                        ID de la mascota
                    </label>

                    <input
                        type="number"
                        id="idMascota"
                        min="1"
                        placeholder="Ingrese el ID de la mascota"
                        required
                        title="Ingrese el ID de la mascota a la que pertenece este perfil."
                    >

                </div>


                <!-- CARACTERISTICAS -->

                <div class="campo">

                    <label for="caracteristicas">
                        Características
                    </label>

                    <textarea
                        id="caracteristicas"
                        maxlength="300"
                        placeholder="Describa las características de la mascota..."
                        required
                    ></textarea>

                </div>


                <!-- COMPORTAMIENTO -->

                <div class="campo">

                    <label for="comportamiento">
                        Comportamiento
                    </label>

                    <textarea
                        id="comportamiento"
                        maxlength="300"
                        placeholder="Describa el comportamiento de la mascota..."
                        required
                    ></textarea>

                </div>


                <!-- GUSTOS -->

                <div class="campo">

                    <label for="gustos">
                        Gustos
                    </label>

                    <textarea
                        id="gustos"
                        maxlength="300"
                        placeholder="Indique los gustos de la mascota..."
                        required
                    ></textarea>

                </div>


                <!-- CUIDADOS ESPECIALES -->

                <div class="campo completo">

                    <label for="cuidadosEspeciales">
                        Cuidados especiales
                    </label>

                    <textarea
                        id="cuidadosEspeciales"
                        maxlength="300"
                        placeholder="Describa los cuidados especiales que necesita la mascota..."
                        required
                    ></textarea>

                </div>


                <!-- BOTONES -->

                <div class="botones">

                    <button
                        type="submit"
                        class="btn-principal"
                        title="Crea un nuevo perfil asociado a la mascota indicada."
                    >
                        Crear perfil
                    </button>


                    <button
                        type="button"
                        onclick="limpiarFormulario()"
                        class="btn-secundario"
                        title="Limpia todos los campos del formulario."
                    >
                        Limpiar formulario
                    </button>

                </div>


            </form>


            <p
                id="mensajeCrear"
                class="mensaje"
            ></p>

        </section>



        <!-- ==============================
             LISTAR PERFILES
        ============================== -->

        <section class="seccion">

            <h2 class="titulo">
                Perfiles de mascotas registrados
            </h2>


            <button
                onclick="listarPerfiles()"
                class="btn-principal"
                title="Consulta todos los perfiles de mascotas registrados y muestra la información en una tabla."
            >
                Listar perfiles
            </button>


            <button
                onclick="ocultarTabla()"
                class="btn-secundario"
                title="Oculta la tabla de perfiles registrados."
            >
                Ocultar tabla
            </button>


            <div
                id="listaPerfiles"
                class="tabla-contenedor"
            ></div>

        </section>



        <!-- ==============================
             BUSCAR PERFIL
        ============================== -->

        <section class="seccion">

            <h2 class="titulo">
                Buscar perfil por ID
            </h2>


            <div class="busqueda">


                <input
                    type="number"
                    id="idBuscar"
                    min="1"
                    placeholder="Ingrese el ID del perfil"
                    title="Ingrese el ID del perfil de mascota que desea consultar."
                >


                <button
                    onclick="buscarPerfil()"
                    class="btn-buscar"
                    title="Busca un perfil de mascota utilizando su ID."
                >
                    Buscar perfil
                </button>


            </div>


            <div
                id="resultadoPerfil"
                class="resultado"
                style="display: none;"
            ></div>

        </section>



        <!-- ==============================
             ACTUALIZAR PERFIL
        ============================== -->

        <section class="seccion">

            <h2 class="titulo">
                Actualizar perfil de mascota
            </h2>


            <div class="formulario">


                <!-- ID PERFIL -->

                <div class="campo">

                    <label for="idActualizar">
                        ID del perfil
                    </label>

                    <input
                        type="number"
                        id="idActualizar"
                        min="1"
                        placeholder="ID del perfil"
                        title="Ingrese el ID del perfil que desea actualizar."
                    >

                </div>


                <!-- ID MASCOTA -->

                <div class="campo">

                    <label for="idMascotaActualizar">
                        ID de la mascota
                    </label>

                    <input
                        type="number"
                        id="idMascotaActualizar"
                        min="1"
                        placeholder="ID de la mascota"
                        title="Ingrese el ID de la mascota asociada al perfil."
                    >

                </div>


                <!-- CARACTERISTICAS -->

                <div class="campo">

                    <label for="caracteristicasActualizar">
                        Características
                    </label>

                    <textarea
                        id="caracteristicasActualizar"
                        maxlength="300"
                        placeholder="Nuevas características"
                    ></textarea>

                </div>


                <!-- COMPORTAMIENTO -->

                <div class="campo">

                    <label for="comportamientoActualizar">
                        Comportamiento
                    </label>

                    <textarea
                        id="comportamientoActualizar"
                        maxlength="300"
                        placeholder="Nuevo comportamiento"
                    ></textarea>

                </div>


                <!-- GUSTOS -->

                <div class="campo">

                    <label for="gustosActualizar">
                        Gustos
                    </label>

                    <textarea
                        id="gustosActualizar"
                        maxlength="300"
                        placeholder="Nuevos gustos"
                    ></textarea>

                </div>


                <!-- CUIDADOS -->

                <div class="campo">

                    <label for="cuidadosActualizar">
                        Cuidados especiales
                    </label>

                    <textarea
                        id="cuidadosActualizar"
                        maxlength="300"
                        placeholder="Nuevos cuidados especiales"
                    ></textarea>

                </div>


                <div class="botones">

                    <button
                        onclick="actualizarPerfil()"
                        class="btn-actualizar"
                        title="Actualiza la información del perfil utilizando su ID."
                    >
                        Actualizar perfil
                    </button>

                </div>

            </div>


            <p
                id="mensajeActualizar"
                class="mensaje"
            ></p>

        </section>



        <!-- ==============================
             ELIMINAR PERFIL
        ============================== -->

        <section class="seccion">

            <h2 class="titulo">
                Eliminar perfil de mascota
            </h2>


            <div class="busqueda">


                <input
                    type="number"
                    id="idEliminar"
                    min="1"
                    placeholder="Ingrese el ID del perfil"
                    title="Ingrese el ID del perfil que desea eliminar."
                >


                <button
                    onclick="eliminarPerfil()"
                    class="btn-eliminar"
                    title="Elimina el perfil de mascota de la base de datos."
                >
                    Eliminar perfil
                </button>


            </div>


            <p
                id="mensajeEliminar"
                class="mensaje"
            ></p>

        </section>


    </div>



    <!-- ==============================
         PIE
    ============================== -->

    <div class="pie">

        My Pet © 2026 · Gestión de perfiles de mascota

    </div>


</div>



<script>


const URL_API =
    "http://localhost:8082/api/perfiles-mascotas";


// ==========================================
// MOSTRAR MENSAJE
// ==========================================

function mostrarMensaje(elemento, texto, tipo) {

    elemento.textContent = texto;

    elemento.className =
        "mensaje " + tipo;

}


// ==========================================
// OBTENER DATOS
// ==========================================

function obtenerDatosPerfil() {

    return {

        mascota: {

            idMascota:
                parseInt(
                    document.getElementById(
                        "idMascota"
                    ).value
                )

        },

        caracteristicas:
            document.getElementById(
                "caracteristicas"
            ).value,

        comportamiento:
            document.getElementById(
                "comportamiento"
            ).value,

        gustos:
            document.getElementById(
                "gustos"
            ).value,

        cuidadosEspeciales:
            document.getElementById(
                "cuidadosEspeciales"
            ).value

    };

}


// ==========================================
// CREAR PERFIL
// POST /api/perfiles-mascotas/guardar
// ==========================================

document
    .getElementById("formPerfilMascota")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const perfil =
                obtenerDatosPerfil();


            fetch(
                URL_API + "/guardar",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(perfil)

                }
            )


            .then(response => {

                if (!response.ok) {

                    return response.text()
                        .then(mensaje => {

                            throw new Error(
                                mensaje ||
                                "No fue posible crear el perfil."
                            );

                        });

                }

                return response.json();

            })


            .then(data => {

                mostrarMensaje(

                    document.getElementById(
                        "mensajeCrear"
                    ),

                    "Perfil de mascota creado correctamente. ID generado: "
                    + data.idPerfilMascota,

                    "exito"

                );


                document
                    .getElementById(
                        "formPerfilMascota"
                    )
                    .reset();

            })


            .catch(error => {

                mostrarMensaje(

                    document.getElementById(
                        "mensajeCrear"
                    ),

                    "Error: " + error.message,

                    "error"

                );

            });

        }
    );


// ==========================================
// LISTAR PERFILES
// GET /api/perfiles-mascotas/listar
// ==========================================

function listarPerfiles() {

    const tabla =
        document.getElementById(
            "listaPerfiles"
        );


    fetch(
        URL_API + "/listar"
    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "No fue posible consultar los perfiles."
            );

        }

        return response.json();

    })


    .then(perfiles => {

        let contenido = "";


        if (perfiles.length === 0) {

            contenido =
                "<p>No hay perfiles registrados.</p>";

        }

        else {

            contenido = `

                <table>

                    <tr>

                        <th>ID perfil</th>

                        <th>Mascota</th>

                        <th>Características</th>

                        <th>Comportamiento</th>

                        <th>Gustos</th>

                        <th>Cuidados especiales</th>

                    </tr>

            `;


            perfiles.forEach(perfil => {

                contenido += `

                    <tr>

                        <td>
                            ${perfil.idPerfilMascota}
                        </td>


                        <!--
                            MOSTRAMOS EL NOMBRE
                            Y TAMBIÉN EL ID
                        -->

                        <td>

                            ${
                                perfil.mascota
                                ? (
                                    perfil.mascota.nombre
                                    + " (ID: "
                                    + perfil.mascota.idMascota
                                    + ")"
                                )
                                : "Sin mascota"
                            }

                        </td>


                        <td>
                            ${perfil.caracteristicas || ""}
                        </td>


                        <td>
                            ${perfil.comportamiento || ""}
                        </td>


                        <td>
                            ${perfil.gustos || ""}
                        </td>


                        <td>
                            ${perfil.cuidadosEspeciales || ""}
                        </td>

                    </tr>

                `;

            });


            contenido += "</table>";

        }


        tabla.innerHTML =
            contenido;


        tabla.style.display =
            "block";

    })


    .catch(error => {

        tabla.innerHTML =
            "<p>Error: "
            + error.message
            + "</p>";


        tabla.style.display =
            "block";

    });

}


// ==========================================
// OCULTAR TABLA
// ==========================================

function ocultarTabla() {

    document
        .getElementById(
            "listaPerfiles"
        )
        .style.display = "none";

}


// ==========================================
// BUSCAR PERFIL
// GET /api/perfiles-mascotas/{id}
// ==========================================

function buscarPerfil() {

    const id =
        document.getElementById(
            "idBuscar"
        ).value;


    const resultado =
        document.getElementById(
            "resultadoPerfil"
        );


    if (!id) {

        resultado.style.display =
            "block";

        resultado.innerHTML =
            "<p>Ingrese el ID del perfil.</p>";

        return;

    }


    fetch(
        URL_API + "/" + id
    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Perfil no encontrado."
            );

        }

        return response.json();

    })


    .then(perfil => {

        resultado.style.display =
            "block";


        resultado.innerHTML = `

            <p>

                <strong>ID del perfil:</strong>

                ${perfil.idPerfilMascota}

            </p>


            <p>

                <strong>Mascota:</strong>

                ${
                    perfil.mascota
                    ? (
                        perfil.mascota.nombre
                        + " (ID: "
                        + perfil.mascota.idMascota
                        + ")"
                    )
                    : "Sin mascota"
                }

            </p>


            <p>

                <strong>Características:</strong>

                ${perfil.caracteristicas || ""}

            </p>


            <p>

                <strong>Comportamiento:</strong>

                ${perfil.comportamiento || ""}

            </p>


            <p>

                <strong>Gustos:</strong>

                ${perfil.gustos || ""}

            </p>


            <p>

                <strong>Cuidados especiales:</strong>

                ${perfil.cuidadosEspeciales || ""}

            </p>

        `;

    })


    .catch(error => {

        resultado.style.display =
            "block";


        resultado.innerHTML =
            "<p>Error: "
            + error.message
            + "</p>";

    });

}


// ==========================================
// ACTUALIZAR PERFIL
// PUT /api/perfiles-mascotas/actualizar/{id}
// ==========================================

function actualizarPerfil() {

    const id =
        document.getElementById(
            "idActualizar"
        ).value;


    const mensaje =
        document.getElementById(
            "mensajeActualizar"
        );


    if (!id) {

        mostrarMensaje(

            mensaje,

            "Ingrese el ID del perfil.",

            "error"

        );

        return;

    }


    const perfil = {

        mascota: {

            idMascota:
                parseInt(
                    document.getElementById(
                        "idMascotaActualizar"
                    ).value
                )

        },

        caracteristicas:
            document.getElementById(
                "caracteristicasActualizar"
            ).value,

        comportamiento:
            document.getElementById(
                "comportamientoActualizar"
            ).value,

        gustos:
            document.getElementById(
                "gustosActualizar"
            ).value,

        cuidadosEspeciales:
            document.getElementById(
                "cuidadosActualizar"
            ).value

    };


    fetch(

        URL_API +
        "/actualizar/" +
        id,

        {

            method: "PUT",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(perfil)

        }

    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "No fue posible actualizar el perfil."
            );

        }

        return response.json();

    })


    .then(data => {

        mostrarMensaje(

            mensaje,

            "Perfil de mascota actualizado correctamente.",

            "exito"

        );

    })


    .catch(error => {

        mostrarMensaje(

            mensaje,

            "Error: " + error.message,

            "error"

        );

    });

}


// ==========================================
// ELIMINAR PERFIL
// DELETE /api/perfiles-mascotas/eliminar/{id}
// ==========================================

function eliminarPerfil() {

    const id =
        document.getElementById(
            "idEliminar"
        ).value;


    const mensaje =
        document.getElementById(
            "mensajeEliminar"
        );


    if (!id) {

        mostrarMensaje(

            mensaje,

            "Ingrese el ID del perfil.",

            "error"

        );

        return;

    }


    const confirmar =
        confirm(

            "¿Está seguro de eliminar el perfil de mascota con ID "
            + id
            + "?"

        );


    if (!confirmar) {

        return;

    }


    fetch(

        URL_API +
        "/eliminar/" +
        id,

        {

            method: "DELETE"

        }

    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "No fue posible eliminar el perfil."
            );

        }

        return response.text();

    })


    .then(data => {

        mostrarMensaje(

            mensaje,

            data,

            "exito"

        );

    })


    .catch(error => {

        mostrarMensaje(

            mensaje,

            "Error: " + error.message,

            "error"

        );

    });

}


// ==========================================
// LIMPIAR FORMULARIO
// ==========================================

function limpiarFormulario() {

    document
        .getElementById(
            "formPerfilMascota"
        )
        .reset();

}


</script>


</body>

</html>
