<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Cliente común de las peticiones de la aplicación -->
    <script src="/JS/api-client.js"></script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Gestión de publicaciones del foro - My Pet</title>


    <!-- =========================================================
         ESTILOS DE ESTA INTERFAZ
         
         Este CSS permanece aquí porque esta pantalla administrativa
         tiene un diseño propio y no depende del estilo general
         de las demás pantallas de My Pet.
         ========================================================= -->

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff7ed, #fef3c7);
            padding: 30px;
        }


        .contenedor {
            max-width: 1100px;
            margin: auto;
        }


        /* ENCABEZADO */

        .encabezado {
            background: linear-gradient(135deg, #ff8a3d, #ffb347);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }


        .logo {
            font-size: 45px;
        }


        .encabezado h1 {
            font-size: 32px;
            margin: 8px 0;
        }


        .encabezado p {
            font-size: 15px;
        }


        /* CONTENIDO */

        .contenido {
            background: white;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }


        .seccion {
            margin-bottom: 40px;
        }


        .titulo {
            font-size: 22px;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }


        /* FORMULARIOS */

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }


        .campo {
            display: flex;
            flex-direction: column;
        }


        .campo label {
            font-weight: bold;
            color: #444;
            margin-bottom: 7px;
        }


        .campo input,
        .campo textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background-color: #fafafa;
        }


        .campo textarea {
            min-height: 130px;
            resize: vertical;
        }


        .campo input:focus,
        .campo textarea:focus {
            border-color: #ff8a3d;
            background-color: white;
            box-shadow:
                0 0 0 3px
                rgba(255, 138, 61, 0.12);
        }


        /* BOTONES */

        .botones {
            grid-column: 1 / 3;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }


        button {
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }


        button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }


        .btn-principal {
            background: #ff8a3d;
            color: white;
        }


        .btn-buscar {
            background: #6c5ce7;
            color: white;
        }


        .btn-eliminar {
            background: #e74c3c;
            color: white;
        }


        .btn-secundario {
            background: #777;
            color: white;
        }


        /* BUSQUEDA */

        .busqueda {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }


        .busqueda input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }


        /* TABLAS */

        .tabla-contenedor {
            overflow-x: auto;
            margin-top: 20px;
            display: none;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }


        th {
            background: #ff8a3d;
            color: white;
            padding: 12px;
            text-align: left;
        }


        td {
            padding: 11px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }


        tr:hover {
            background-color: #fff7ed;
        }


        /* COMENTARIOS Y RESPUESTAS */

        .comentario-admin {
            background: #fff7ed;
            border-left: 4px solid #ff8a3d;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 7px;
        }


        .comentario-admin strong {
            color: #333;
        }


        .comentario-admin small {
            color: #777;
        }


        .respuesta-admin {
            margin-top: 8px;
            margin-left: 20px;
            padding: 8px 10px;
            background: white;
            border-left: 2px solid #ccc;
            border-radius: 6px;
        }


        .titulo-respuestas {
            display: block;
            margin-top: 8px;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }


        /* RESULTADOS */

        .resultado {
            margin-top: 20px;
            padding: 20px;
            background: #fff7ed;
            border-radius: 10px;
            border-left: 4px solid #ff8a3d;
            display: none;
            overflow-x: auto;
        }


        /* MENSAJES */

        .mensaje {
            padding: 12px;
            margin-top: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }


        .exito {
            display: block;
            background: #dcfce7;
            color: #166534;
        }


        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }


        /* PIE */

        .pie {
            background: #fafafa;
            padding: 18px;
            text-align: center;
            color: #777;
            border-radius: 0 0 20px 20px;
        }


        /* ADAPTACIÓN PARA PANTALLAS PEQUEÑAS */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }


            .formulario {
                grid-template-columns: 1fr;
            }


            .botones {
                grid-column: 1;
            }


            .busqueda {
                flex-direction: column;
            }


            .encabezado h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="contenedor">


    <!-- =========================================================
         ENCABEZADO
         ========================================================= -->

    <div class="encabezado">

        <div class="logo">
            🐾
        </div>

        <h1>
            My Pet
        </h1>

        <p>
            Gestión de publicaciones del foro
        </p>

    </div>


    <div class="contenido">


        <!-- =====================================================
             REGISTRAR PUBLICACIÓN
             ===================================================== -->

        <section class="seccion">

            <h2 class="titulo">
                Registrar publicación

            <form

            >

                    <label for="titulo">

                <div class="campo">

                    </label>

                    <input

                        min="1"
                        placeholder="Ingrese el ID del usuario"

                    >

                <div
                    class="campo"
                    style="grid-column: 1 / 3;"
                >

                    <label for="contenido">
                        Contenido
                    </label>

                    <textarea
                        id="contenido"
                        placeholder="Escriba el contenido de la publicación"
                        required
                    ></textarea>

                <div class="botones">

                    <button
                        type="submit"
                        class="btn-principal"

                        Publicar
                    </button>

                </div>

            <p
                id="mensajeRegistro"

            ></p>

        </section>


        <!-- =====================================================
             LISTAR PUBLICACIONES Y COMENTARIOS
             ===================================================== -->

        <section class="seccion">

            <h2 class="titulo">
                Publicaciones registradas
            </h2>


            <button
                onclick="listarPublicaciones()"

                Listar publicaciones

            <button
                onclick="ocultarTabla()"
                class="btn-secundario"

                Ocultar tabla
            </button>

            ></div>

        <!-- =====================================================
             BUSCAR PUBLICACIONES POR USUARIO

            <div class="busqueda">

        <!-- =====================================================

                    <input

                    >

                <div class="campo">

                    <label for="idUsuarioActualizar">
                        ID del usuario
                    </label>

                    <input
                        type="number"
                        id="idUsuarioActualizar"

                    >

        <!-- =====================================================
             ELIMINAR PUBLICACIÓN

        <section class="seccion">

<!-- =============================================================
     JAVASCRIPT DE ESTA INTERFAZ

     Se mantiene en este mismo HTML porque esta página es una
     interfaz administrativa independiente. Sus funciones están
     directamente relacionadas con los formularios, tablas y
     elementos que existen aquí.

     Esto evita depender de foro.js, que pertenece a la interfaz
     pública del foro y tiene otra finalidad.
     ============================================================= -->

<script>


// ============================================================
// URL BASE DE LA API DE PUBLICACIONES
// ============================================================

const URL_API =
    "/api/publicaciones-foro";



// ============================================================
// REGISTRAR PUBLICACIÓN
// ============================================================

document
    .getElementById("formPublicacion")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const publicacion = {

                titulo:
                    document.getElementById(
                        "titulo"
                    ).value,

                contenido:
                    document.getElementById(
                        "contenido"
                    ).value,

                usuario: {

                    idUsuario:
                        parseInt(
                            document.getElementById(
                                "idUsuario"
                            ).value
                        )

                }

            };


            fetch(
                URL_API + "/guardar",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            publicacion
                        )

                }
            )

            .then(response => {

                if (!response.ok) {

                    return response.text()
                        .then(mensaje => {

                            throw new Error(
                                mensaje ||
                                "No fue posible registrar la publicación."
                            );

                        });

                }


                return response.json();

            })

            .then(data => {

                const mensaje =
                    document.getElementById(
                        "mensajeRegistro"
                    );


                mensaje.textContent =
                    "Publicación registrada correctamente. ID generado: "
                    + data.idPublicacion;


                mensaje.className =
                    "mensaje exito";


                document
                    .getElementById(
                        "formPublicacion"
                    )
                    .reset();

            })

            .catch(error => {

                const mensaje =
                    document.getElementById(
                        "mensajeRegistro"
                    );


                mensaje.textContent =
                    "Error: " + error.message;


                mensaje.className =
                    "mensaje error";

            });

        }
    );



// ============================================================
// LISTAR PUBLICACIONES
//
// También consulta los comentarios de cada publicación.
// ============================================================

async function listarPublicaciones() {

    const tabla =
        document.getElementById(
            "listaPublicaciones"
        );


    tabla.innerHTML =
        "<p>Cargando publicaciones y comentarios...</p>";


    tabla.style.display =
        "block";


    try {

        const respuesta =
            await fetch(
                URL_API + "/listar"
            );


        if (!respuesta.ok) {

            throw new Error(
                "No fue posible consultar las publicaciones."
            );
        }


        const publicaciones =
            await respuesta.json();


        console.log(
            "Publicaciones recibidas:",
            publicaciones
        );


        if (!Array.isArray(publicaciones)) {

            throw new Error(
                "El servidor no devolvió una lista de publicaciones."
            );
        }


        let contenido = "";


        if (publicaciones.length === 0) {

            contenido =
                "<p>No hay publicaciones registradas.</p>";

        } else {

            contenido = `

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Título</th>

                            <th>Contenido</th>

                            <th>Fecha</th>

                            <th>ID usuario</th>

                            <th>Nombre usuario</th>

                            <th>Comentarios</th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            // Se procesa cada publicación y sus comentarios.

            for (
                const publicacion
                of publicaciones
            ) {


                const comentariosHTML =
                    await obtenerComentariosPublicacion(
                        publicacion.idPublicacion
                    );


                const idUsuario =
                    publicacion.usuario
                        ? publicacion.usuario.idUsuario
                        : "";


                const nombreUsuario =
                    publicacion.usuario
                        ? (
                            publicacion.usuario.nombre ||
                            publicacion.usuario.nombreUsuario ||
                            publicacion.usuario.username ||
                            ""
                        )
                        : "";


                contenido += `

                    <tr>

                        <td>
                            ${escaparHTML(
                                publicacion.idPublicacion
                            )}
                        </td>

                        <td>
                            ${escaparHTML(
                                publicacion.titulo || ""
                            )}
                        </td>

                        <td>
                            ${escaparHTML(
                                publicacion.contenido || ""
                            )}
                        </td>

                        <td>
                            ${escaparHTML(
                                publicacion.fecha || ""
                            )}
                        </td>

                        <td>
                            ${escaparHTML(
                                idUsuario
                            )}
                        </td>

                        <td>
                            ${escaparHTML(
                                nombreUsuario
                            )}
                        </td>

                        <td>
                            ${comentariosHTML}
                        </td>

                    </tr>

                `;
            }


            contenido += `

                    </tbody>

                </table>

            `;
        }


        tabla.innerHTML =
            contenido;


    } catch (error) {

        console.error(
            "Error al listar publicaciones:",
            error
        );


        tabla.innerHTML = `

            <p style="color:#c0392b;">

                Error:
                ${escaparHTML(error.message)}

            </p>

        `;
    }

}



// ============================================================
// OBTENER COMENTARIOS DE UNA PUBLICACIÓN
// ============================================================

async function obtenerComentariosPublicacion(
    idPublicacion
) {

    try {

        console.log(
            "Consultando comentarios de la publicación:",
            idPublicacion
        );


        const respuesta =
            await fetch(
                "/api/comentarios-foro/publicacion/"
                + idPublicacion
            );


        console.log(
            "Estado de comentarios:",
            respuesta.status
        );


        if (!respuesta.ok) {

            const mensajeError =
                await respuesta.text();


            console.error(
                "Respuesta del servidor al consultar comentarios:",
                mensajeError
            );


            return `

                <span style="color:#c0392b;">

                    No se pudieron cargar los comentarios.

                </span>

            `;
        }


        const datos =
            await respuesta.json();


        console.log(
            "Comentarios recibidos para publicación "
            + idPublicacion
            + ":",
            datos
        );


        /*
         * El backend debería devolver directamente un arreglo.
         *
         * También se contemplan las propiedades "comentarios"
         * y "content" por si el controlador devuelve el arreglo
         * dentro de un objeto.
         */

        let comentarios =
            datos;


        if (!Array.isArray(comentarios)) {

            if (
                Array.isArray(
                    datos.comentarios
                )
            ) {

                comentarios =
                    datos.comentarios;

            } else if (
                Array.isArray(
                    datos.content
                )
            ) {

                comentarios =
                    datos.content;

            } else {

                console.error(
                    "Formato de comentarios no reconocido:",
                    datos
                );


                return `

                    <span style="color:#c0392b;">

                        El formato de los comentarios no es válido.

                    </span>

                `;
            }
        }


        if (comentarios.length === 0) {

            return `

                <span style="color:#777;">

                    Sin comentarios

                </span>

            `;
        }


        let html = "";


        /*
         * Se muestran los comentarios principales.
         *
         * Las respuestas se consultan por separado mediante
         * el endpoint correspondiente.
         */

        for (
            const comentario
            of comentarios
        ) {


            /*
             * Si el comentario tiene un padre,
             * se considera una respuesta y no se muestra
             * como comentario principal.
             */

            if (
                comentario.comentarioPadre !== null &&
                comentario.comentarioPadre !== undefined
            ) {

                continue;
            }


            const nombreUsuario =
                comentario.usuario
                    ? (
                        comentario.usuario.nombre ||
                        comentario.usuario.nombreUsuario ||
                        comentario.usuario.username ||
                        "Usuario"
                    )
                    : "Usuario";


            html += `

                <div class="comentario-admin">

                    <strong>

                        ${escaparHTML(
                            nombreUsuario
                        )}

                    </strong>

                    <br>

                    <span>

                        ${escaparHTML(
                            comentario.contenido || ""
                        )}

                    </span>

                    <br>

                    <small>

                        ${escaparHTML(
                            comentario.fecha || ""
                        )}

                    </small>

            `;


            /*
             * Buscar las respuestas del comentario.
             */

            if (
                comentario.idComentario !== null &&
                comentario.idComentario !== undefined
            ) {

                const respuestas =
                    await obtenerRespuestasComentario(
                        comentario.idComentario
                    );


                html +=
                    respuestas;
            }


            html += `

                </div>

            `;
        }


        if (!html) {

            return `

                <span style="color:#777;">

                    No hay comentarios principales.

                </span>

            `;
        }


        return html;


    } catch (error) {

        console.error(
            "Error al cargar comentarios:",
            error
        );


        return `

            <span style="color:#c0392b;">

                Error al cargar comentarios.

            </span>

        `;
    }

}



// ============================================================
// OBTENER RESPUESTAS DE UN COMENTARIO
// ============================================================

async function obtenerRespuestasComentario(
    idComentario
) {

    try {

        console.log(
            "Consultando respuestas del comentario:",
            idComentario
        );


        const respuesta =
            await fetch(
                "/api/comentarios-foro/"
                + idComentario
                + "/respuestas"
            );


        if (!respuesta.ok) {

            console.error(
                "No se pudieron cargar las respuestas:",
                respuesta.status
            );


            return "";
        }


        const datos =
            await respuesta.json();


        let respuestas =
            datos;


        /*
         * Se aceptan varias estructuras posibles
         * de respuesta del backend.
         */

        if (!Array.isArray(respuestas)) {

            if (
                Array.isArray(
                    datos.respuestas
                )
            ) {

                respuestas =
                    datos.respuestas;

            } else if (
                Array.isArray(
                    datos.content
                )
            ) {

                respuestas =
                    datos.content;

            } else {

                console.error(
                    "Formato de respuestas no reconocido:",
                    datos
                );


                return "";
            }
        }


        if (respuestas.length === 0) {

            return "";
        }


        let html = `

            <div class="titulo-respuestas">

                Respuestas:

            </div>

        `;


        respuestas.forEach(
            respuestaComentario => {


                const nombreUsuario =
                    respuestaComentario.usuario
                        ? (
                            respuestaComentario.usuario.nombre ||
                            respuestaComentario.usuario.nombreUsuario ||
                            respuestaComentario.usuario.username ||
                            "Usuario"
                        )
                        : "Usuario";


                html += `

                    <div class="respuesta-admin">

                        <strong>

                            ${escaparHTML(
                                nombreUsuario
                            )}

                        </strong>

                        <br>

                        <span>

                            ${escaparHTML(
                                respuestaComentario.contenido || ""
                            )}

                        </span>

                        <br>

                        <small>

                            ${escaparHTML(
                                respuestaComentario.fecha || ""
                            )}

                        </small>

                    </div>

                `;
            }
        );


        return html;


    } catch (error) {

        console.error(
            "Error al cargar respuestas:",
            error
        );


        return "";
    }

}



// ============================================================
// PROTEGER TEXTO MOSTRADO EN HTML
// ============================================================

function escaparHTML(texto) {

    if (
        texto === null ||
        texto === undefined
    ) {

        return "";
    }


    const elemento =
        document.createElement(
            "div"
        );


    elemento.textContent =
        texto;


    return elemento.innerHTML;
}



// ============================================================
// OCULTAR TABLA
// ============================================================

function ocultarTabla() {

    document
        .getElementById(
            "listaPublicaciones"
        )
        .style.display =
            "none";

}



// ============================================================
// BUSCAR PUBLICACIONES POR USUARIO
// ============================================================

function buscarPorUsuario() {

    const id =
        document.getElementById(
            "idUsuarioBuscar"
        ).value;


    const resultado =
        document.getElementById(
            "resultadoUsuario"
        );


    if (!id) {

        resultado.style.display =
            "block";


        resultado.innerHTML =
            "<p>Ingrese el ID del usuario.</p>";


        return;
    }


    fetch(
        URL_API + "/usuario/" + id
    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "No fue posible consultar las publicaciones del usuario."
            );
        }


        return response.json();

    })


    .then(publicaciones => {

        resultado.style.display =
            "block";


        if (
            !Array.isArray(publicaciones) ||
            publicaciones.length === 0
        ) {

            resultado.innerHTML =
                "<p>El usuario no tiene publicaciones registradas.</p>";


            return;
        }


        let contenido = `

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Título</th>

                        <th>Contenido</th>

                        <th>Fecha</th>

                    </tr>

                </thead>

                <tbody>

        `;


        publicaciones.forEach(
            publicacion => {

                contenido += `

                    <tr>

                        <td>
                            ${escaparHTML(
                                publicacion.idPublicacion
                            )}
                        </td>

                        <td>
                            ${escaparHTML(
                                publicacion.titulo || ""
                            )}
                        </td>

                        <td>
                            ${escaparHTML(
                                publicacion.contenido || ""
                            )}
                        </td>

                        <td>
                            ${escaparHTML(
                                publicacion.fecha || ""
                            )}
                        </td>

                    </tr>

                `;
            }
        );


        contenido += `

                </tbody>

            </table>

        `;


        resultado.innerHTML =
            contenido;

    })


    .catch(error => {

        resultado.style.display =
            "block";


        resultado.innerHTML =
            "<p>Error: "
            + escaparHTML(error.message)
            + "</p>";

    });

}



// ============================================================
// ACTUALIZAR PUBLICACIÓN
// ============================================================

document
    .getElementById("formActualizar")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const id =
                document.getElementById(
                    "idActualizar"
                ).value;


            const publicacion = {

                titulo:
                    document.getElementById(
                        "tituloActualizar"
                    ).value,

                contenido:
                    document.getElementById(
                        "contenidoActualizar"
                    ).value,

                usuario: {

                    idUsuario:
                        parseInt(
                            document.getElementById(
                                "idUsuarioActualizar"
                            ).value
                        )

                }

            };


            fetch(
                URL_API + "/" + id,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            publicacion
                        )

                }
            )


            .then(response => {

                if (!response.ok) {

                    return response.text()
                        .then(mensaje => {

                            throw new Error(
                                mensaje ||
                                "No fue posible actualizar la publicación."
                            );

                        });

                }


                return response.json();

            })


            .then(data => {

                const mensaje =
                    document.getElementById(
                        "mensajeActualizar"
                    );


                mensaje.textContent =
                    "Publicación actualizada correctamente. ID: "
                    + data.idPublicacion;


                mensaje.className =
                    "mensaje exito";


                document
                    .getElementById(
                        "formActualizar"
                    )
                    .reset();

            })


            .catch(error => {

                const mensaje =
                    document.getElementById(
                        "mensajeActualizar"
                    );


                mensaje.textContent =
                    "Error: "
                    + error.message;


                mensaje.className =
                    "mensaje error";

            });

        }
    );



// ============================================================
// ELIMINAR PUBLICACIÓN
// ============================================================

function eliminarPublicacion() {

    const id =
        document.getElementById(
            "idEliminar"
        ).value;


    const mensaje =
        document.getElementById(
            "mensajeEliminar"
        );


    if (!id) {

        mensaje.textContent =
            "Ingrese el ID de la publicación.";


        mensaje.className =
            "mensaje error";


        return;
    }


    const confirmar =
        confirm(
            "¿Está seguro de eliminar la publicación con ID "
            + id
            + "?"
        );


    if (!confirmar) {

        return;
    }


    fetch(
        URL_API + "/" + id,
        {

            method: "DELETE"

        }
    )


    .then(response => {

        if (!response.ok) {

            return response.text()
                .then(mensajeError => {

                    throw new Error(
                        mensajeError ||
                        "No fue posible eliminar la publicación."
                    );

                });

        }


        return response.text();

    })


    .then(data => {

        mensaje.textContent =
            data ||
            "Publicación eliminada correctamente.";


        mensaje.className =
            "mensaje exito";


        document
            .getElementById(
                "idEliminar"
            )
            .value = "";

    })


    .catch(error => {

        mensaje.textContent =
            "Error: "
            + error.message;


        mensaje.className =
            "mensaje error";

    });

}
