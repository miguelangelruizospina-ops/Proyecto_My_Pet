<!DOCTYPE html>
<html lang="es">

<head>
    <script src="/JS/api-client.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de usuarios - My Pet</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff7ed, #fef3c7);
            padding: 30px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
        }


        /* ==============================
           ENCABEZADO
        ============================== */

        .encabezado {
            background: linear-gradient(135deg, #ff8a3d, #ffb347);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 20px 20px 0 0;
        }

        .logo {
            font-size: 45px;
        }

        .encabezado h1 {
            font-size: 32px;
            margin: 8px 0;
        }

        .encabezado p {
            font-size: 15px;
        }


        /* ==============================
           CONTENIDO
        ============================== */

        .contenido {
            background: white;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .seccion {
            margin-bottom: 40px;
        }

        .titulo {
            font-size: 22px;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }


        /* ==============================
           FORMULARIOS
        ============================== */

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-weight: bold;
            color: #444;
            margin-bottom: 7px;
        }

        .campo input,
        .campo select {

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            background-color: #fafafa;
        }

        .campo input:focus,
        .campo select:focus {

            border-color: #ff8a3d;

            background-color: white;

            box-shadow:
                0 0 0 3px
                rgba(255, 138, 61, 0.12);
        }


        /* ==============================
           BOTONES
        ============================== */

        .botones {

            grid-column: 1 / 3;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        button {

            border: none;

            padding: 12px 20px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;

            transition: 0.2s;
        }

        button:hover {

            opacity: 0.85;

            transform: translateY(-1px);
        }

        .btn-principal {

            background: #ff8a3d;

            color: white;
        }

        .btn-buscar {

            background: #6c5ce7;

            color: white;
        }

        .btn-actualizar {

            background: #3498db;

            color: white;
        }

        .btn-eliminar {

            background: #e74c3c;

            color: white;
        }

        .btn-secundario {

            background: #777;

            color: white;
        }


        /* ==============================
           BUSQUEDA
        ============================== */

        .busqueda {

            display: flex;

            gap: 10px;
        }

        .busqueda input {

            flex: 1;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;
        }

        .busqueda input:focus {

            border-color: #ff8a3d;

            box-shadow:
                0 0 0 3px
                rgba(255, 138, 61, 0.12);
        }


        /* ==============================
           RESULTADO
        ============================== */

        .resultado {

            margin-top: 20px;

            padding: 20px;

            background: #fff7ed;

            border-radius: 10px;

            border-left: 4px solid #ff8a3d;
        }

        .resultado p {

            margin-bottom: 8px;

            color: #444;
        }


        /* ==============================
           TABLA
        ============================== */

        .tabla-contenedor {

            overflow-x: auto;

            margin-top: 20px;

            display: none;
        }

        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 750px;
        }

        th {

            background: #ff8a3d;

            color: white;

            padding: 12px;

            text-align: left;
        }

        td {

            padding: 11px;

            border-bottom: 1px solid #eee;
        }

        tr:hover {

            background-color: #fff7ed;
        }


        /* ==============================
           MENSAJES
        ============================== */

        .mensaje {

            padding: 12px;

            margin-top: 20px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;

            display: none;
        }

        .exito {

            display: block;

            background: #dcfce7;

            color: #166534;
        }

        .error {

            display: block;

            background: #fee2e2;

            color: #991b1b;
        }


        /* ==============================
           PIE
        ============================== */

        .pie {

            background: #fafafa;

            padding: 18px;

            text-align: center;

            color: #777;

            border-radius: 0 0 20px 20px;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .botones {
                grid-column: 1;
            }

            .busqueda {
                flex-direction: column;
            }

            .encabezado h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="contenedor">


    <!-- ==============================
         ENCABEZADO
    ============================== -->

    <div class="encabezado">

        <div class="logo">
            🐾
        </div>

        <h1>
            My Pet
        </h1>

        <p>
            Gestión de usuarios
        </p>

    </div>


    <div class="contenido">


        <!-- ==============================
             REGISTRAR USUARIO
        ============================== -->

        <section class="seccion">

            <h2 class="titulo">
                Registrar usuario
            </h2>


            <form
                id="formRegistro"
                class="formulario"
            >


                <div class="campo">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ingrese el nombre"
                        required
                        title="Escriba el nombre del nuevo usuario."
                    >

                </div>


                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="ejemplo@correo.com"
                        required
                        title="Escriba un correo electrónico válido para el usuario."
                    >

                </div>


                <div class="campo">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        placeholder="Ingrese una contraseña"
                        required
                        title="Escriba la contraseña que tendrá el usuario."
                    >

                </div>


                <div class="campo">

                    <label for="rol">
                        Rol
                    </label>

                    <select
                        id="rol"
                        title="Seleccione el tipo de usuario que tendrá el sistema."
                    >

                        <option value="USUARIO">
                            Usuario
                        </option>

                        <option value="ADMIN">
                            Administrador
                        </option>

                    </select>

                </div>


                <div class="botones">

                    <button
                        type="submit"
                        class="btn-principal"
                        title="Registra el usuario en la base de datos. El ID será generado automáticamente."
                    >
                        Registrar usuario
                    </button>

                </div>

            </form>


            <p
                id="mensajeRegistro"
                class="mensaje"
            ></p>

        </section>



        <!-- ==============================
             LISTAR USUARIOS
        ============================== -->

        <section class="seccion">

            <h2 class="titulo">
                Usuarios registrados
            </h2>


            <button
                onclick="listarUsuarios()"
                class="btn-principal"
                title="Consulta todos los usuarios registrados y muestra la información en una tabla."
            >
                Listar usuarios
            </button>


            <button
                onclick="ocultarTabla()"
                class="btn-secundario"
                title="Oculta la tabla de usuarios registrados."
            >
                Ocultar tabla
            </button>


            <div
                id="listaUsuarios"
                class="tabla-contenedor"
            ></div>

        </section>



        <!-- ==============================
             BUSCAR USUARIO
        ============================== -->

        <section class="seccion">

            <h2 class="titulo">
                Buscar usuario por ID
            </h2>


            <div class="busqueda">


                <input
                    type="number"
                    id="idBuscar"
                    min="1"
                    placeholder="Ingrese el ID del usuario"
                    title="Escriba el ID del usuario que desea consultar."
                >


                <button
                    onclick="buscarUsuario()"
                    class="btn-buscar"
                    title="Busca un usuario específico utilizando su ID."
                >
                    Buscar usuario
                </button>


            </div>


            <div
                id="resultadoUsuario"
                class="resultado"
                style="display: none;"
            ></div>

        </section>



        <!-- ==============================
             ACTUALIZAR USUARIO
        ============================== -->

        <section class="seccion">

            <h2 class="titulo">
                Actualizar usuario
            </h2>


            <div class="formulario">


                <div class="campo">

                    <label for="idActualizar">
                        ID del usuario
                    </label>

                    <input
                        type="number"
                        id="idActualizar"
                        min="1"
                        placeholder="ID del usuario"
                        title="Escriba el ID del usuario que desea modificar."
                    >

                </div>


                <div class="campo">

                    <label for="nombreActualizar">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombreActualizar"
                        placeholder="Nuevo nombre"
                        title="Escriba el nuevo nombre del usuario."
                    >

                </div>


                <div class="campo">

                    <label for="correoActualizar">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correoActualizar"
                        placeholder="Nuevo correo"
                        title="Escriba el nuevo correo electrónico."
                    >

                </div>


                <div class="campo">

                    <label for="contrasenaActualizar">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasenaActualizar"
                        placeholder="Nueva contraseña"
                        title="Escriba la nueva contraseña del usuario."
                    >

                </div>


                <div class="campo">

                    <label for="rolActualizar">
                        Rol
                    </label>

                    <select
                        id="rolActualizar"
                        title="Seleccione el nuevo rol del usuario."
                    >

                        <option value="USUARIO">
                            Usuario
                        </option>

                        <option value="ADMIN">
                            Administrador
                        </option>

                    </select>

                </div>


                <div class="botones">

                    <button
                        onclick="actualizarUsuario()"
                        class="btn-actualizar"
                        title="Actualiza la información del usuario utilizando el ID ingresado."
                    >
                        Actualizar usuario
                    </button>

                </div>

            </div>


            <p
                id="mensajeActualizar"
                class="mensaje"
            ></p>

        </section>



        <!-- ==============================
             ELIMINAR USUARIO
        ============================== -->

        <section class="seccion">

            <h2 class="titulo">
                Eliminar usuario
            </h2>


            <div class="busqueda">


                <input
                    type="number"
                    id="idEliminar"
                    min="1"
                    placeholder="Ingrese el ID del usuario"
                    title="Escriba el ID del usuario que desea eliminar."
                >


                <button
                    onclick="eliminarUsuario()"
                    class="btn-eliminar"
                    title="Elimina de la base de datos el usuario cuyo ID haya ingresado."
                >
                    Eliminar usuario
                </button>


            </div>


            <p
                id="mensajeEliminar"
                class="mensaje"
            ></p>

        </section>


    </div>



    <!-- ==============================
         PIE
    ============================== -->

    <div class="pie">

        My Pet © 2026 · Gestión de usuarios 🐾

    </div>


</div>



<script>


const URL_API =
    "http://localhost:8082/api/usuario";


// ==========================================
// REGISTRAR USUARIO
// POST /api/usuario/registro
// ==========================================

document
    .getElementById("formRegistro")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const usuario = {

            nombre:
                document.getElementById("nombre").value,

            correo:
                document.getElementById("correo").value,

            contrasena:
                document.getElementById("contrasena").value,

            rol:
                document.getElementById("rol").value

        };


        fetch(
            URL_API + "/registro",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body:
                    JSON.stringify(usuario)

            }
        )


        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "No fue posible registrar el usuario."
                );

            }

            return response.json();

        })


        .then(data => {

            const mensaje =
                document.getElementById(
                    "mensajeRegistro"
                );


            mensaje.textContent =
                "Usuario registrado correctamente. ID generado: "
                + data.idUsuario;


            mensaje.className =
                "mensaje exito";


            document
                .getElementById("formRegistro")
                .reset();

        })


        .catch(error => {

            const mensaje =
                document.getElementById(
                    "mensajeRegistro"
                );


            mensaje.textContent =
                "Error: " + error.message;


            mensaje.className =
                "mensaje error";

        });

    });


// ==========================================
// LISTAR USUARIOS
// GET /api/usuario/listar
// ==========================================

function listarUsuarios() {

    const tabla =
        document.getElementById(
            "listaUsuarios"
        );


    fetch(
        URL_API + "/listar"
    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "No fue posible consultar los usuarios."
            );

        }

        return response.json();

    })


    .then(usuarios => {

        let contenido = "";


        if (usuarios.length === 0) {

            contenido =
                "<p>No hay usuarios registrados.</p>";

        }

        else {

            contenido = `

                <table>

                    <tr>

                        <th>ID</th>

                        <th>Nombre</th>

                        <th>Correo</th>

                        <th>Rol</th>

                        <th>Fecha de creación</th>

                    </tr>

            `;


            usuarios.forEach(usuario => {

                contenido += `

                    <tr>

                        <td>
                            ${usuario.idUsuario}
                        </td>

                        <td>
                            ${usuario.nombre}
                        </td>

                        <td>
                            ${usuario.correo}
                        </td>

                        <td>
                            ${usuario.rol}
                        </td>

                        <td>
                            ${usuario.fechaCreacion || ""}
                        </td>

                    </tr>

                `;

            });


            contenido += "</table>";

        }


        tabla.innerHTML =
            contenido;


        tabla.style.display =
            "block";

    })


    .catch(error => {

        tabla.innerHTML =
            "<p>Error: "
            + error.message
            + "</p>";


        tabla.style.display =
            "block";

    });

}


// ==========================================
// OCULTAR TABLA
// ==========================================

function ocultarTabla() {

    document
        .getElementById("listaUsuarios")
        .style.display = "none";

}


// ==========================================
// BUSCAR USUARIO
// GET /api/usuario/{id}
// ==========================================

function buscarUsuario() {

    const id =
        document.getElementById(
            "idBuscar"
        ).value;


    const resultado =
        document.getElementById(
            "resultadoUsuario"
        );


    if (!id) {

        resultado.style.display =
            "block";

        resultado.innerHTML =
            "<p>Ingrese el ID del usuario.</p>";

        return;

    }


    fetch(
        URL_API + "/" + id
    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Usuario no encontrado."
            );

        }

        return response.json();

    })


    .then(usuario => {

        resultado.style.display =
            "block";


        resultado.innerHTML = `

            <p>
                <strong>ID:</strong>
                ${usuario.idUsuario}
            </p>

            <p>
                <strong>Nombre:</strong>
                ${usuario.nombre}
            </p>

            <p>
                <strong>Correo:</strong>
                ${usuario.correo}
            </p>

            <p>
                <strong>Rol:</strong>
                ${usuario.rol}
            </p>

            <p>
                <strong>Fecha de creación:</strong>
                ${usuario.fechaCreacion || ""}
            </p>

        `;

    })


    .catch(error => {

        resultado.style.display =
            "block";


        resultado.innerHTML =
            "<p>Error: "
            + error.message
            + "</p>";

    });

}


// ==========================================
// ACTUALIZAR USUARIO
// PUT /api/usuario/actualizar/{id}
// ==========================================

function actualizarUsuario() {

    const id =
        document.getElementById(
            "idActualizar"
        ).value;


    const mensaje =
        document.getElementById(
            "mensajeActualizar"
        );


    if (!id) {

        mensaje.textContent =
            "Ingrese el ID del usuario.";

        mensaje.className =
            "mensaje error";

        return;

    }


    const usuario = {

        nombre:
            document.getElementById(
                "nombreActualizar"
            ).value,

        correo:
            document.getElementById(
                "correoActualizar"
            ).value,

        contrasena:
            document.getElementById(
                "contrasenaActualizar"
            ).value,

        rol:
            document.getElementById(
                "rolActualizar"
            ).value

    };


    fetch(
        URL_API + "/actualizar/" + id,
        {

            method: "PUT",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(usuario)

        }
    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "No fue posible actualizar el usuario."
            );

        }

        return response.json();

    })


    .then(data => {

        mensaje.textContent =
            "Usuario actualizado correctamente.";

        mensaje.className =
            "mensaje exito";

    })


    .catch(error => {

        mensaje.textContent =
            "Error: " + error.message;

        mensaje.className =
            "mensaje error";

    });

}


// ==========================================
// ELIMINAR USUARIO
// DELETE /api/usuario/eliminar/{id}
// ==========================================

function eliminarUsuario() {

    const id =
        document.getElementById(
            "idEliminar"
        ).value;


    const mensaje =
        document.getElementById(
            "mensajeEliminar"
        );


    if (!id) {

        mensaje.textContent =
            "Ingrese el ID del usuario.";

        mensaje.className =
            "mensaje error";

        return;

    }


    const confirmar =
        confirm(
            "¿Está seguro de eliminar el usuario con ID "
            + id
            + "?"
        );


    if (!confirmar) {

        return;

    }


    fetch(
        URL_API + "/eliminar/" + id,
        {

            method: "DELETE"

        }
    )


    .then(response => {

        if (!response.ok) {

            throw new Error(
                "No fue posible eliminar el usuario."
            );

        }

        return response.text();

    })


    .then(data => {

        mensaje.textContent =
            data;

        mensaje.className =
            "mensaje exito";

    })


    .catch(error => {

        mensaje.textContent =
            "Error: " + error.message;

        mensaje.className =
            "mensaje error";

    });

}

</script>


</body>

</html>
