<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Configuración de caracteres y adaptación a dispositivos móviles. -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Título de la página del foro. -->

    <title>Foro - Mi Pet</title>

    <!-- Bootstrap para los estilos y componentes de la interfaz. -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Iconos utilizados en la interfaz. -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Hoja de estilos principal de Mi Pet. -->

    <link
        rel="stylesheet"
        href="../mi_pet.css">

</head>

<body class="fondo_pata">

    <!-- Encabezado de la página con el botón para regresar y el título. -->

    <header class="py-3 px-4 mb-4">

        <div class="d-flex align-items-center mb-2">

            <a
                class="flecha me-3"
                href="../Modulo_1_gestion_usuario/home.html"
                title="Volver">

                ←

            </a>

        </div>

        <div class="titulo-naranja">

            <h1>
                Foro
            </h1>

        </div>

    </header>

    <!-- Contenedor donde foro.js carga las publicaciones de la comunidad. -->

    <main
        class="container contenedor_foro">

        <!-- Las publicaciones se generan dinámicamente desde el backend. -->

    </main>

    <!-- Botón flotante que abre el formulario para crear una publicación. -->

    <button
        type="button"
        class="btn_flotante_agregar"
        onclick="document.getElementById('dialogo_nuevo_post').showModal()"
        title="Crear publicación">

        +

    </button>

    <!-- Ventana modal para crear y enviar una publicación al foro. -->

    <dialog
        id="dialogo_nuevo_post"
        class="rounded-4 shadow-lg border-0">

        <div class="p-3">

            <h3
                class="titulo_modal_naranja mb-3 fw-bold">

                Crear publicación

            </h3>

            <!-- Formulario con los campos del título y el contenido. -->

            <form
                id="formulario-nueva-publicacion">

                <!-- Campo para ingresar el título de la publicación. -->

                <div class="mb-3">

                    <label
                        for="titulo-publicacion"
                        class="form-label text-dark fw-semibold">

                        Título

                    </label>

                    <input
                        type="text"
                        id="titulo-publicacion"
                        class="form-control"
                        maxlength="200"
                        placeholder="Escribe el título de tu publicación"
                        required>

                </div>

                <!-- Campo para redactar el mensaje de la publicación. -->

                <div class="mb-3">

                    <label
                        for="contenido-publicacion"
                        class="form-label text-dark fw-semibold">

                        Escribe tu mensaje:

                    </label>

                    <textarea
                        id="contenido-publicacion"
                        class="form-control"
                        rows="4"
                        maxlength="500"
                        placeholder="¿Qué estás pensando para la comunidad?"
                        required></textarea>

                </div>

                <!-- Botones para cerrar el formulario o enviar la publicación. -->

                <div
                    class="d-flex justify-content-end gap-2">

                    <button
                        type="button"
                        class="btn btn-outline-secondary px-4 rounded-pill"
                        onclick="this.closest('dialog').close()">

                        Cerrar

                    </button>

                    <button
                        type="submit"
                        class="btn btn-naranja-modal px-4 rounded-pill fw-bold">

                        Enviar mensaje

                    </button>

                </div>

            </form>

        </div>

    </dialog>

    <!-- Carga de Bootstrap JavaScript para los componentes interactivos. -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Script encargado de gestionar los "Me gusta" de las publicaciones. -->

    <script src="/JS/me_gusta_publicacion.js"></script>

    <!-- Script encargado de cargar y gestionar las publicaciones del foro. -->

    <script src="/JS/foro.js"></script>

    <!-- Script que aplica la configuración global de la aplicación. -->

    <script src="/JS/configuracion_global.js"></script>

</body>

</html>
