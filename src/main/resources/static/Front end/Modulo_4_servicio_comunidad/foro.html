<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro - Mi Pet</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Tu archivo CSS -->
    <link rel="stylesheet" href="../mi_pet.css">
</head>
<body class="fondo_pata">

    <!-- Encabezado con Flecha y Título -->
    <header class="py-3 px-4 mb-4">
        <div class="d-flex align-items-center mb-2">
            <a class="flecha me-3" href="../Modulo_1_gestion_usuario/home.html" title="Volver">←</a>
        </div>
        <div class="titulo-naranja">
            <h1>Foro</h1>
        </div>
    </header>

    <!-- Contenedor Principal del Feed / Foro -->
    <main class="container contenedor_foro">

        <!-- Publicación Ejemplo 1 (Demostración de post activo) -->
        <div class="card tarjeta_post shadow-lg mb-4">
            <div class="card-body p-4">
                <div class="d-flex align-items-center mb-3">
                    <div class="avatar_usuario me-3">
                        <i class="bi bi-person-fill fs-3 text-secondary"></i>
                    </div>
                    <div>
                        <h6 class="m-0 fw-bold text-dark">Carlos Ruiz</h6>
                        <small class="text-muted">Hace 15 minutos</small>
                    </div>
                </div>
                <p class="card-text text-dark fs-5">
                    ¡Hola a todos! ¿Alguien conoce un buen parque en la zona para llevar a mi perrito este fin de semana? 🐾
                </p>
                <hr class="my-3 text-muted opacity-25">
                
                <!-- Acciones de la publicación -->
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div class="d-flex gap-3">
                        <a href="#" class="btn_accion_icono" title="Me gusta">
                            <i class="bi bi-heart-fill me-1 text-danger"></i> <span>12</span>
                        </a>
                        <a href="#" class="btn_accion_icono" title="Comentar">
                            <i class="bi bi-chat-dots-fill me-1 text-primary"></i> <span>4</span>
                        </a>
                        <a href="#" class="btn_accion_icono" title="Compartir">
                            <i class="bi bi-share-fill me-1 text-secondary"></i>
                        </a>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/Formularios%20HTML/Modulo%204/Publicion_foro.html" class="btn_editar_hover">
                            <i class="bi bi-pencil-square me-1"></i> Editar
                        </a>
                        <button type="button" class="btn_eliminar_hover" onclick="return confirm('¿Estás seguro de que deseas eliminar esta publicación?')">
                            <i class="bi bi-trash-fill me-1"></i> Eliminar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Estado Vacío / Publicaciones recientes -->
        <div class="card tarjeta_post shadow-lg mb-4">
            <div class="card-body p-4 text-center">
                <div class="espacio_vacio_publicacion my-3">
                    <p class="m-0 fw-bold">No hay más publicaciones en este momento.</p>
                    <small class="text-muted">¡Usa el botón "+" flotante para escribir una nueva!</small>
                </div>
            </div>
        </div>

    </main>

    <!-- Botón Flotante para Nueva Publicación (+) -->
    <button type="button" class="btn_flotante_agregar" onclick="document.getElementById('dialogo_nuevo_post').showModal()" title="Agregar comentario al foro">
        +
    </button>

    <!-- Diálogo / Modal Emergente -->
    <dialog id="dialogo_nuevo_post" class="rounded-4 shadow-lg border-0">
        <div class="p-3">
            <h3 class="titulo_modal_naranja mb-3 fw-bold">Crear publicación</h3>
            <form method="dialog">
                <div class="mb-3">
                    <label class="form-label text-dark fw-semibold">Escribe tu mensaje:</label>
                    <textarea class="form-control" rows="4" placeholder="¿Qué estás pensando para la comunidad?"></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-outline-secondary px-4 rounded-pill" onclick="this.closest('dialog').close()">Cerrar</button>
                    <button type="submit" class="btn btn-naranja-modal px-4 rounded-pill fw-bold">Enviar mensaje</button>
                </div>
            </form>
        </div>
    </dialog>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
