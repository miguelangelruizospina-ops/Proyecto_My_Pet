<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Foro - Mi Pet</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- CSS principal de Mi Pet -->
    <link
        rel="stylesheet"
        href="../mi_pet.css">

</head>


<body class="fondo_pata">


    <!-- ==========================================
         ENCABEZADO
         ========================================== -->

    <header class="py-3 px-4 mb-4">

        <div class="d-flex align-items-center mb-2">

            <a
                class="flecha me-3"
                href="../Modulo_1_gestion_usuario/home.html"
                title="Volver">

                ←

            </a>

        </div>


        <div class="titulo-naranja">

            <h1>
                Foro
            </h1>

        </div>

    </header>



    <!-- ==========================================
         CONTENEDOR DEL FORO
         ========================================== -->

    <main
        class="container contenedor_foro">

        <!--
            Las publicaciones se cargan
            automáticamente desde el backend
            mediante foro.js.
        -->

    </main>



    <!-- ==========================================
         BOTÓN FLOTANTE
         ========================================== -->

    <button
        type="button"
        class="btn_flotante_agregar"
        onclick="document.getElementById('dialogo_nuevo_post').showModal()"
        title="Crear publicación">

        +

    </button>



    <!-- ==========================================
         MODAL CREAR PUBLICACIÓN
         ========================================== -->

    <dialog
        id="dialogo_nuevo_post"
        class="rounded-4 shadow-lg border-0">

        <div class="p-3">


            <h3
                class="titulo_modal_naranja mb-3 fw-bold">

                Crear publicación

            </h3>


            <form
                id="formulario-nueva-publicacion">


                <!-- TÍTULO -->

                <div class="mb-3">

                    <label
                        for="titulo-publicacion"
                        class="form-label text-dark fw-semibold">

                        Título

                    </label>


                    <input
                        type="text"
                        id="titulo-publicacion"
                        class="form-control"
                        maxlength="200"
                        placeholder="Escribe el título de tu publicación"
                        required>

                </div>



                <!-- CONTENIDO -->

                <div class="mb-3">

                    <label
                        for="contenido-publicacion"
                        class="form-label text-dark fw-semibold">

                        Escribe tu mensaje:

                    </label>


                    <textarea
                        id="contenido-publicacion"
                        class="form-control"
                        rows="4"
                        maxlength="500"
                        placeholder="¿Qué estás pensando para la comunidad?"
                        required></textarea>

                </div>



                <!-- BOTONES -->

                <div
                    class="d-flex justify-content-end gap-2">


                    <button
                        type="button"
                        class="btn btn-outline-secondary px-4 rounded-pill"
                        onclick="this.closest('dialog').close()">

                        Cerrar

                    </button>


                    <button
                        type="submit"
                        class="btn btn-naranja-modal px-4 rounded-pill fw-bold">

                        Enviar mensaje

                    </button>

                </div>


            </form>

        </div>

    </dialog>



    <!-- ==========================================
         BOOTSTRAP JS
         ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- ==========================================
         JAVASCRIPT DEL ME GUSTA DE PUBLICACIONES
         ========================================== -->

    <script src="/JS/me_gusta_publicacion.js"></script>


    <!-- ==========================================
         JAVASCRIPT DEL FORO
         ========================================== -->

    <script src="/JS/foro.js"></script>


</body>

</html>
