
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">


    <!-- Bootstrap para la estructura responsiva de la interfaz -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Estilos generales y de identidad visual de My Pet -->
    <link
        rel="stylesheet"
        href="../mi_pet.css">


    <!-- Leaflet permite mostrar el mapa interactivo -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


    <title>Mapa | My Pet</title>


    <!--
        Estilos específicos del módulo.

        Se mantienen aquí porque corresponden únicamente
        al funcionamiento visual del mapa y a su adaptación
        a diferentes tamaños de pantalla. El resto del diseño
        utiliza los estilos generales definidos en mi_pet.css.
    -->
    <style>

        /*
         * Leaflet necesita una altura definida para
         * poder renderizar correctamente el mapa.
         */
        #mapa {
            width: 100%;
            height: 550px;
            border-radius: 10px;
            overflow: hidden;
        }


        /*
         * Botón específico del mapa.
         * Conserva el color principal de My Pet y
         * utiliza una forma ovalada coherente con la interfaz.
         */
        .boton-mapa {
            background-color: #F7931E;
            border: none;
            color: #000000 !important;
            border-radius: 50px;
            padding: 10px 30px;
            font-weight: 600;
        }


        .boton-mapa:hover {
            background-color: #df7f0e;
            color: #000000 !important;
        }


        /*
         * Ajusta el tamaño del mapa en dispositivos
         * con pantallas más pequeñas.
         */
        @media (max-width: 768px) {

            #mapa {
                height: 450px;
            }

        }

    </style>

</head>


<body class="fondo_pata min-vh-100">


    <main
        class="container py-4"
        style="max-width: 1000px">


        <!-- Encabezado principal del módulo -->
        <header class="text-center my-4">

            <h1 class="titulo-naranja">
                Mapa
            </h1>

            <p class="text-white">
                Encuentra veterinarias, clínicas y lugares para tu mascota.
            </p>

        </header>


        <!-- Buscador de lugares -->
        <section
            class="bg-white p-4 rounded mb-4"
            aria-labelledby="tituloBusqueda">


            <h2
                class="h5"
                id="tituloBusqueda">

                Buscar un lugar

            </h2>


            <p>
                Busca veterinarias, clínicas, parques, tiendas y otros
                lugares de interés.
            </p>


            <div class="row g-2">

                <div class="col-12 col-md-9">

                    <label
                        class="visually-hidden"
                        for="buscadorMapa">

                        Lugar a buscar

                    </label>

                    <input
                        type="text"
                        id="buscadorMapa"
                        class="form-control"
                        placeholder="Ejemplo: veterinaria, clínica, parque...">

                </div>


                <div class="col-12 col-md-3">

                    <button
                        type="button"
                        id="btnBuscar"
                        class="btn btn-primary w-100">

                        Buscar

                    </button>

                </div>

            </div>


            <p
                id="mensajeMapa"
                class="text-muted mt-3 mb-0"
                role="status"
                aria-live="polite">

                Solicitando acceso a tu ubicación...

            </p>

        </section>


        <!-- Área donde se muestra el mapa interactivo -->
        <section
            class="bg-white p-4 rounded mb-4"
            aria-labelledby="tituloMapa">


            <h2
                class="h5"
                id="tituloMapa">

                Mapa interactivo

            </h2>


            <p>
                Permite el acceso a tu ubicación para encontrar lugares
                cercanos.
            </p>


            <div id="mapa"></div>


        </section>


        <!-- Acción principal para volver a la ubicación del usuario -->
        <section
            class="text-center mb-4">


            <button
                type="button"
                id="btnMiUbicacion"
                class="btn boton-mapa">

                 Mi ubicación

            </button>


        </section>


    </main>


    <!-- Leaflet controla el mapa interactivo -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- JavaScript propio del módulo -->
    <script src="/JS/mapa.js"></script>


</body>

</html>
