<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Documentos - My Pet</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Estilos generales de My Pet -->
    <link
        rel="stylesheet"
        href="../mi_pet.css">


    <!-- Estilos específicos de documentos -->
    <link
        rel="stylesheet"
        href="CSS/estilos.css">

</head>


<body class="fondo_pata">


    <!-- Flecha para regresar al perfil de la mascota. -->
    <a
        href="perfil_mascota.html"
        class="flecha flecha-back"
        aria-label="Volver al perfil de la mascota">
        ←
    </a>


    <!-- Contenido principal de la gestión de documentos. -->
    <main class="container py-5">


        <!-- Título de la página. -->
        <div class="text-center mb-4">

            <h1 class="text-white fw-bold">
                Documentos
            </h1>

        </div>


        <!-- Formulario para agregar documentos. -->
        <section class="tarjeta-mascota mx-auto">

            <h2 class="titulo-perfil-mascota text-center">
                Agregar documento
            </h2>


            <!-- Tipo de documento. -->
            <div class="mb-3">

                <label
                    for="tipoDocumento"
                    class="form-label">

                    Tipo de documento

                </label>


                <select
                    id="tipoDocumento"
                    class="form-select">

                    <option value="">
                        Selecciona un tipo
                    </option>


                    <optgroup label="Documentos generales">

                        <option value="Identificación">
                            Identificación
                        </option>

                        <option value="Registro">
                            Registro
                        </option>

                        <option value="Adopción">
                            Adopción
                        </option>

                        <option value="Otro">
                            Otro
                        </option>

                    </optgroup>


                    <optgroup label="Documentos médicos">

                        <option value="Carné de vacunas">
                            Carné de vacunas
                        </option>

                        <option value="Historia clínica">
                            Historia clínica
                        </option>

                        <option value="Fórmula médica">
                            Fórmula médica
                        </option>

                        <option value="Examen médico">
                            Examen médico
                        </option>

                        <option value="Otro médico">
                            Otro documento médico
                        </option>

                    </optgroup>


                    <optgroup label="Fotos">

                        <option value="Foto de mascota">
                            Foto de mascota
                        </option>

                        <option value="Foto de documento">
                            Foto de documento
                        </option>

                    </optgroup>

                </select>

            </div>


            <!-- Nombre que tendrá el documento. -->
            <div class="mb-3">

                <label
                    for="nombreDocumento"
                    class="form-label">

                    Nombre del documento

                </label>


                <input
                    type="text"
                    id="nombreDocumento"
                    class="form-control"
                    placeholder="Ejemplo: Vacunas 2026">

            </div>


            <!-- Fecha asociada al documento. -->
            <div class="mb-3">

                <label
                    for="fechaDocumento"
                    class="form-label">

                    Fecha del documento

                </label>


                <input
                    type="date"
                    id="fechaDocumento"
                    class="form-control">

            </div>


            <!-- Archivo que será almacenado en el servidor. -->
            <div class="mb-3">

                <label
                    for="archivoDocumento"
                    class="form-label">

                    Archivo

                </label>


                <input
                    type="file"
                    id="archivoDocumento"
                    class="form-control"
                    accept=".pdf,.jpg,.jpeg,.png">


                <small class="text-white">

                    Formatos permitidos:
                    PDF, JPG, JPEG y PNG.

                </small>

            </div>


            <!-- Botón para guardar el documento. -->
            <div class="text-center">

                <button
                    type="button"
                    id="btnAgregarDocumento"
                    class="btn-perfil-mascota">

                    Agregar documento

                </button>

            </div>

        </section>


        <!-- Lista de documentos guardados. -->
        <section
            id="ventanaDocumentos"
            class="tarjeta-mascota mx-auto mt-4">


            <h2
                class="text-center titulo-documentos-guardados">

                Documentos guardados

            </h2>


            <!-- Los documentos se cargan mediante documento.js. -->
            <div
                id="listaDocumentos"
                class="lista-documentos">

                <p class="text-center text-white">

                    Cargando documentos...

                </p>

            </div>

        </section>

    </main>


    <!-- JavaScript encargado de gestionar los documentos. -->
    <script src="/JS/documento.js"></script>


</body>

</html>
