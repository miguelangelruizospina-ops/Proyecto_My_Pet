<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Carga el cliente encargado de las solicitudes a la API. -->

    <script src="/JS/api-client.js"></script>

    <!-- Configura la codificación de caracteres y la adaptación a dispositivos móviles. -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Importa Bootstrap para los estilos y componentes de la interfaz. -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Importa los estilos personalizados de My Pet. -->

    <link rel="stylesheet" href="../mi_pet.css">

    <!-- Define el título que aparece en la pestaña del navegador. -->

    <title>Tus Mascotas</title>

</head>

<!-- Organiza la página verticalmente y aplica el fondo y los espacios generales. -->

<body class="fondo_pata min-vh-100 d-flex flex-column align-items-center py-3">

    <!-- ===================================================== -->
    <!-- FLECHA PARA REGRESAR -->
    <!-- ===================================================== -->

    <!-- Permite regresar a la página principal del usuario. -->

    <div class="w-100 px-4">

        <a
            class="flecha text-decoration-none"
            href="../Modulo_1_gestion_usuario/home.html">

            ←

        </a>

    </div>

    <!-- ===================================================== -->
    <!-- TÍTULO -->
    <!-- ===================================================== -->

    <!-- Presenta el encabezado principal de la página. -->

    <header class="text-center my-2">

        <h1 class="titulo-naranja">

            Tus Mascotas

        </h1>

    </header>

    <!-- ===================================================== -->
    <!-- MASCOTAS -->
    <!-- ===================================================== -->

    <!-- Contiene las tarjetas de las mascotas y el botón para agregar nuevas. -->

    <main class="container my-4">

        <div
            id="contenedorMascotas"
            class="row justify-content-center align-items-center g-4">

            <!-- Las tarjetas de las mascotas se generan dinámicamente con JavaScript. -->

            <!-- ================================================= -->
            <!-- BOTÓN AGREGAR MASCOTA -->
            <!-- ================================================= -->

            <!-- Abre el formulario para registrar una nueva mascota. -->

            <div
                id="columnaAgregarMascota"
                class="col-12 col-md-6 col-lg-4 d-flex flex-column align-items-center">

                <div class="text-center">

                    <button
                        type="button"
                        id="btnAbrirAgregarMascota"
                        class="boton-agregar-mascota mx-auto"
                        title="Agregar mascota nueva"
                        aria-label="Agregar mascota nueva">

                        <span>+</span>

                    </button>

                    <h2 class="nom-masco mt-3">

                        Agregar Mascota

                    </h2>

                </div>

            </div>

        </div>

    </main>

    <!-- ===================================================== -->
    <!-- MODAL AGREGAR MASCOTA -->
    <!-- ===================================================== -->

    <!-- Ventana emergente que contiene el formulario de registro. -->

    <div
        class="modal fade"
        id="ventanaAgregarMascota"
        tabindex="-1"
        aria-labelledby="tituloAgregarMascota"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <!-- ================================================= -->
                <!-- ENCABEZADO -->
                <!-- ================================================= -->

                <!-- Muestra el título del formulario y el botón para cerrar la ventana. -->

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="tituloAgregarMascota">

                        Agregar Mascota

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        id="cerrarVentanaMascota"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">

                    </button>

                </div>

                <!-- ================================================= -->
                <!-- FORMULARIO -->
                <!-- ================================================= -->

                <!-- Recopila la información necesaria para registrar la mascota. -->

                <form id="formAgregarMascota">

                    <div class="modal-body">

                        <!-- ================================================= -->
                        <!-- NOMBRE -->
                        <!-- ================================================= -->

                        <!-- Campo para ingresar el nombre de la mascota. -->

                        <div class="mb-3">

                            <label
                                for="nombreMascota"
                                class="form-label">

                                Nombre

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombreMascota"
                                required>

                        </div>

                        <!-- ================================================= -->
                        <!-- ESPECIE -->
                        <!-- ================================================= -->

                        <!-- Campo para indicar la especie de la mascota. -->

                        <div class="mb-3">

                            <label
                                for="especieMascota"
                                class="form-label">

                                Especie

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="especieMascota"
                                placeholder="Ejemplo: Perro"
                                required>

                        </div>

                        <!-- ================================================= -->
                        <!-- RAZA -->
                        <!-- ================================================= -->

                        <!-- Campo para registrar la raza de la mascota. -->

                        <div class="mb-3">

                            <label
                                for="razaMascota"
                                class="form-label">

                                Raza

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="razaMascota"
                                required>

                        </div>

                        <!-- ================================================= -->
                        <!-- FECHA DE NACIMIENTO -->
                        <!-- ================================================= -->

                        <!-- Permite seleccionar la fecha de nacimiento de la mascota. -->

                        <div class="mb-3">

                            <label
                                for="fechaNacimientoMascota"
                                class="form-label">

                                Fecha de nacimiento

                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="fechaNacimientoMascota"
                                required>

                        </div>

                        <!-- ================================================= -->
                        <!-- FOTO -->
                        <!-- ================================================= -->

                        <!-- Permite seleccionar una imagen y mostrar su vista previa. -->

                        <div class="mb-3">

                            <label
                                for="fotoMascota"
                                class="form-label">

                                Foto

                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="fotoMascota"
                                accept="image/jpeg,image/png,image/webp,image/gif">

                            <!-- Muestra la imagen seleccionada antes de guardar el registro. -->

                            <img
                                id="previewFotoMascota"
                                class="img-thumbnail mt-2 d-none"
                                alt="Vista previa de la mascota"
                                style="max-width: 180px; max-height: 180px; object-fit: cover;">

                            <!-- Informa los formatos de imagen admitidos y el tamaño máximo permitido. -->

                            <div class="form-text">

                                JPG, PNG, WebP o GIF; máximo 5 MB.

                            </div>

                        </div>

                    </div>

                    <!-- ================================================= -->
                    <!-- BOTONES -->
                    <!-- ================================================= -->

                    <!-- Ofrece las opciones para cancelar o guardar el registro. -->

                    <div class="modal-footer">

                        <button
                            type="button"
                            id="cancelarMascota"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Cancelar

                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Guardar Mascota

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- BOOTSTRAP -->
    <!-- ===================================================== -->

    <!-- Carga los componentes interactivos de Bootstrap, incluidos los modales. -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- ===================================================== -->
    <!-- JAVASCRIPT DE MASCOTAS -->
    <!-- ===================================================== -->

    <!-- Gestiona las operaciones relacionadas con las mascotas. -->

    <script src="/JS/mascota.js"></script>

    <!-- Aplica la configuración global de la aplicación. -->

    <script src="/JS/configuracion_global.js"></script>

</body>

</html>
