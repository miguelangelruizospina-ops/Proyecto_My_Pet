<!DOCTYPE html>
<html lang="es">

<head>

    <script src="/JS/api-client.js"></script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Diseño propio de My Pet -->
    <link rel="stylesheet" href="../mi_pet.css">

    <title>Tus Mascotas</title>

</head>


<body class="fondo_pata min-vh-100 d-flex flex-column align-items-center py-3">


    <!-- ===================================================== -->
    <!-- FLECHA PARA REGRESAR -->
    <!-- ===================================================== -->

    <div class="w-100 px-4">

        <a
            class="flecha text-decoration-none"
            href="../Modulo_1_gestion_usuario/home.html">

            ←

        </a>

    </div>


    <!-- ===================================================== -->
    <!-- TÍTULO -->
    <!-- ===================================================== -->

    <header class="text-center my-2">

        <h1 class="titulo-naranja">

            Tus Mascotas

        </h1>

    </header>


    <!-- ===================================================== -->
    <!-- MASCOTAS -->
    <!-- ===================================================== -->

    <main class="container my-4">

        <div
            id="contenedorMascotas"
            class="row justify-content-center align-items-center g-4">


            <!-- ================================================= -->
            <!-- MASCOTAS CARGADAS POR JAVASCRIPT -->
            <!-- ================================================= -->

            <!--
                Las mascotas serán agregadas aquí
                automáticamente por mascota.js.
            -->


            <!-- ================================================= -->
            <!-- BOTÓN AGREGAR MASCOTA -->
            <!-- ================================================= -->

            <div
                id="columnaAgregarMascota"
                class="col-12 col-md-6 col-lg-4 d-flex flex-column align-items-center">

                <div class="text-center">

                    <button
                        type="button"
                        id="btnAbrirAgregarMascota"
                        class="boton-agregar-mascota mx-auto"
                        title="Agregar mascota nueva"
                        aria-label="Agregar mascota nueva">

                        <span>+</span>

                    </button>


                    <h2 class="nom-masco mt-3">

                        Agregar Mascota

                    </h2>

                </div>

            </div>

        </div>

    </main>


    <!-- ===================================================== -->
    <!-- MODAL AGREGAR MASCOTA -->
    <!-- ===================================================== -->

    <div
        class="modal fade"
        id="ventanaAgregarMascota"
        tabindex="-1"
        aria-labelledby="tituloAgregarMascota"
        aria-hidden="true">


        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">


                <!-- ================================================= -->
                <!-- ENCABEZADO -->
                <!-- ================================================= -->

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="tituloAgregarMascota">

                        Agregar Mascota

                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        id="cerrarVentanaMascota"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">

                    </button>

                </div>


                <!-- ================================================= -->
                <!-- FORMULARIO -->
                <!-- ================================================= -->

                <form id="formAgregarMascota">

                    <div class="modal-body">


                        <!-- ================================================= -->
                        <!-- NOMBRE -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="nombreMascota"
                                class="form-label">

                                Nombre

                            </label>


                            <input
                                type="text"
                                class="form-control"
                                id="nombreMascota"
                                required>

                        </div>


                        <!-- ================================================= -->
                        <!-- ESPECIE -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="especieMascota"
                                class="form-label">

                                Especie

                            </label>


                            <input
                                type="text"
                                class="form-control"
                                id="especieMascota"
                                placeholder="Ejemplo: Perro"
                                required>

                        </div>


                        <!-- ================================================= -->
                        <!-- RAZA -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="razaMascota"
                                class="form-label">

                                Raza

                            </label>


                            <input
                                type="text"
                                class="form-control"
                                id="razaMascota"
                                required>

                        </div>


                        <!-- ================================================= -->
                        <!-- FECHA DE NACIMIENTO -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="fechaNacimientoMascota"
                                class="form-label">

                                Fecha de nacimiento

                            </label>


                            <input
                                type="date"
                                class="form-control"
                                id="fechaNacimientoMascota"
                                required>

                        </div>


                        <!-- ================================================= -->
                        <!-- FOTO -->
                        <!-- ================================================= -->

                        <div class="mb-3">

                            <label
                                for="fotoMascota"
                                class="form-label">

                                Foto

                            </label>


                            <input
                                type="file"
                                class="form-control"
                                id="fotoMascota"
                                accept="image/jpeg,image/png,image/webp,image/gif">


                            <img
                                id="previewFotoMascota"
                                class="img-thumbnail mt-2 d-none"
                                alt="Vista previa de la mascota"
                                style="max-width: 180px; max-height: 180px; object-fit: cover;">


                            <div class="form-text">

                                JPG, PNG, WebP o GIF; máximo 5 MB.

                            </div>

                        </div>

                    </div>


                    <!-- ================================================= -->
                    <!-- BOTONES -->
                    <!-- ================================================= -->

                    <div class="modal-footer">


                        <button
                            type="button"
                            id="cancelarMascota"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Cancelar

                        </button>


                        <button
                            type="submit"
                            class="btn btn-primary">

                            Guardar Mascota

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- BOOTSTRAP -->
    <!-- ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- ===================================================== -->
    <!-- JAVASCRIPT DE MASCOTAS -->
    <!-- ===================================================== -->

    <script src="/JS/mascota.js"></script>


</body>

</html>
