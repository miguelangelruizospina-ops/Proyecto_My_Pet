<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración básica del documento y adaptación a dispositivos móviles. -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define el título de la página en la pestaña del navegador. -->

    <title>Historial Médico - My Pet</title>

    <!-- Carga Bootstrap para utilizar sus estilos y componentes. -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Carga la hoja de estilos principal de My Pet. -->

    <link rel="stylesheet" href="../mi_pet.css">
</head>

<body class="fondo_pata min-vh-100 d-flex flex-column align-items-center py-3">

    <!-- Contenedor principal de la página del historial médico. -->

    <main class="contenedor-historial">

        <!-- Encabezado con el título y el acceso para regresar al perfil. -->

        <header class="encabezado-historial">

            <!-- Permite regresar al perfil de la mascota mediante JavaScript. -->

            <a href="#" id="flechaVolverPerfil" class="flecha flecha-back" aria-label="Regresar al perfil de la mascota">
                &#8592;
            </a>

            <h1>Historial Médico</h1>
        </header>

        <!-- Muestra la información básica de identificación de la mascota. -->

        <section class="informacion-mascota">

            <h2 id="nombreMascota">
                Historial médico de la mascota
            </h2>
        </section>

        <!-- Informa si la mascota todavía no tiene un historial médico registrado. -->

        <section id="estadoSinHistorial" class="estado-historial">

            <p>
                Esta mascota todavía no tiene un historial médico registrado.
            </p>

            <!-- Permite iniciar la creación de un historial médico. -->

            <button type="button" id="btnCrearHistorial" class="btn btn-primary">
                Crear historial médico
            </button>
        </section>

        <!-- Contiene el formulario para crear o editar el historial médico. -->

        <section id="formularioHistorial" class="formulario-historial" style="display: none;">

            <form id="formHistorial">

                <!-- Permite registrar los antecedentes médicos de la mascota. -->

                <div class="mb-3">

                    <label for="antecedentes" class="form-label">Antecedentes médicos</label>
                    <textarea id="antecedentes" class="form-control" rows="4" placeholder="Ingrese los antecedentes médicos de la mascota"></textarea>
                </div>

                <!-- Permite registrar las alergias conocidas de la mascota. -->

                <div class="mb-3">

                    <label for="alergias" class="form-label">Alergias</label>
                    <textarea id="alergias" class="form-control" rows="3" placeholder="Ingrese las alergias conocidas"></textarea>
                </div>

                <!-- Permite registrar los medicamentos que recibe actualmente la mascota. -->

                <div class="mb-3">

                    <label for="medicamentos" class="form-label">Medicamentos actuales</label>
                    <textarea id="medicamentos" class="form-control" rows="3" placeholder="Ingrese los medicamentos actuales"></textarea>
                </div>

                <!-- Permite registrar la información relacionada con las vacunas. -->

                <div class="mb-3">

                    <label for="vacunas" class="form-label">Vacunas</label>
                    <textarea id="vacunas" class="form-control" rows="3" placeholder="Ingrese información sobre las vacunas"></textarea>
                </div>

                <!-- Permite registrar las cirugías realizadas a la mascota. -->

                <div class="mb-3">

                    <label for="cirugias" class="form-label">Cirugías</label>
                    <textarea id="cirugias" class="form-control" rows="3" placeholder="Ingrese información sobre cirugías"></textarea>
                </div>

                <!-- Permite agregar observaciones adicionales sobre la salud de la mascota. -->

                <div class="mb-3">

                    <label for="observaciones" class="form-label">Observaciones</label>
                    <textarea id="observaciones" class="form-control" rows="4" placeholder="Ingrese observaciones adicionales"></textarea>
                </div>

                <!-- Agrupa los botones para guardar los cambios o cancelar la edición. -->

                <div class="acciones-formulario d-flex gap-2">

                    <button type="submit" id="btnGuardarHistorial" class="btn btn-primary">
                        Guardar
                    </button>

                    <button type="button" id="btnCancelarEdicion" class="btn btn-secondary" style="display: none;">
                        Cancelar
                    </button>
                </div>

            </form>
        </section>

        <!-- Presenta la información del historial médico que ya está registrada. -->

        <section id="informacionHistorial" class="informacion-historial" style="display: none;">

            <!-- Muestra los antecedentes médicos registrados. -->

            <div class="campo-historial">

                <h3>Antecedentes médicos</h3>
                <p id="mostrarAntecedentes"></p>
            </div>

            <!-- Muestra las alergias registradas. -->

            <div class="campo-historial">

                <h3>Alergias</h3>
                <p id="mostrarAlergias"></p>
            </div>

            <!-- Muestra los medicamentos actuales registrados. -->

            <div class="campo-historial">

                <h3>Medicamentos actuales</h3>
                <p id="mostrarMedicamentos"></p>
            </div>

            <!-- Muestra la información de vacunación registrada. -->

            <div class="campo-historial">

                <h3>Vacunas</h3>
                <p id="mostrarVacunas"></p>
            </div>

            <!-- Muestra la información de las cirugías registradas. -->

            <div class="campo-historial">

                <h3>Cirugías</h3>
                <p id="mostrarCirugias"></p>
            </div>

            <!-- Muestra las observaciones adicionales registradas. -->

            <div class="campo-historial">

                <h3>Observaciones</h3>
                <p id="mostrarObservaciones"></p>
            </div>

            <!-- Contiene el botón para habilitar la edición de la información. -->

            <div class="acciones-historial mt-3">

                <button type="button" id="btnEditarInformacion" class="btn btn-warning">
                    Editar información
                </button>
            </div>

        </section>
    </main>

    <!-- Carga los componentes JavaScript de Bootstrap. -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Carga la lógica encargada de gestionar el historial médico. -->

    <script src="/JS/HIstorial_medico.js"></script>

    <!-- Carga la configuración global de la aplicación. -->

    <script src="/JS/configuracion_global.js"></script>

</body>

</html>
