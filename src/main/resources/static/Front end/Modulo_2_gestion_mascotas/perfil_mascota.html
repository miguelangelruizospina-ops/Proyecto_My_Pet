<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Carga el cliente encargado de las solicitudes a la API. -->

    <script src="/JS/api-client.js"></script>

    <!-- Configura la codificación de caracteres y la adaptación a dispositivos móviles. -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Importa Bootstrap para los estilos y componentes de la interfaz. -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Define el título de la página en el navegador. -->

    <title>Perfil de mascota</title>

    <!-- Importa los estilos principales de My Pet. -->

    <link rel="stylesheet" href="../mi_pet.css">

</head>

<!-- Organiza los elementos verticalmente y aplica el fondo y los espacios generales. -->

<body class="fondo_pata min-vh-100 d-flex flex-column align-items-center py-3">

    <!-- ========================================== -->
    <!-- FLECHA PARA VOLVER -->
    <!-- ========================================== -->

    <!-- Permite regresar a la lista de mascotas. -->

    <div class="w-100 px-4">

        <a class="flecha text-decoration-none"
           href="mis_mascotas.html">

            ←

        </a>

    </div>

    <!-- ========================================== -->
    <!-- BOTÓN SOS -->
    <!-- ========================================== -->

    <!-- Proporciona acceso directo al módulo de emergencias. -->

    <a id="enlaceEmergencia" href="/Front%20end/Modulo_5_emergencia/emergencia.html"
       class="boton-sos">

        SOS

    </a>

    <!-- ========================================== -->
    <!-- FOTO Y NOMBRE -->
    <!-- ========================================== -->

    <!-- Muestra la fotografía y el nombre de la mascota seleccionada. -->

    <header class="text-center d-flex flex-column align-items-center my-2">

        <!-- Permite seleccionar una fotografía nueva al hacer clic en el marco. -->

        <label for="input-foto-mascota"
               class="marco-foto-per"
               title="Haz clic para cambiar la foto">

            <!-- Presenta la fotografía actual de la mascota. -->

            <img src="fotos/anny.jpg"
                 alt="Foto de la mascota"
                 id="fotoMascota">

            <!-- Campo para seleccionar una imagen desde el dispositivo. -->

            <input type="file"
                   id="input-foto-mascota"
                   class="d-none"
                   accept="image/*">

            <!-- Muestra la indicación para cambiar la fotografía. -->

            <div class="overlay-cambiar-foto">

                <span>Cambiar foto</span>

            </div>

        </label>

        <!-- Muestra el nombre de la mascota en el encabezado del perfil. -->

        <h1 id="nombreMascotaTitulo"
            class="mt-3"
            style="color: white !important;">

            Anny

        </h1>

    </header>

    <!-- ========================================== -->
    <!-- INFORMACIÓN DE LA MASCOTA -->
    <!-- ========================================== -->

    <!-- Presenta los datos registrados de la mascota. -->

    <div id="informacionMascota"
         class="tarjeta-mascota">

        <h2 class="titulo-perfil-mascota text-center">

            Información de la mascota

        </h2>

        <!-- Muestra el nombre registrado. -->

        <p id="nombreMascota"
           class="dato-mascota">

            Nombre: Anny

        </p>

        <!-- Muestra la especie de la mascota. -->

        <p id="especieMascota"
           class="dato-mascota">

            Especie: Canino

        </p>

        <!-- Muestra la raza registrada. -->

        <p id="razaMascota"
           class="dato-mascota">

            Raza: Poodle

        </p>

        <!-- Presenta la fecha de nacimiento registrada. -->

        <p id="fechaNacimientoMascota"
           class="dato-mascota">

            Fecha de nacimiento: -

        </p>

        <!-- Muestra la edad calculada o recuperada por JavaScript. -->

        <p id="edadMascota"
           class="dato-mascota">

            Edad: -

        </p>

        <hr>

        <!-- Presenta las características particulares de la mascota. -->

        <p id="caracteristicasInformacion"
           class="dato-mascota">

            Características: -

        </p>

        <!-- Muestra la información relacionada con su comportamiento. -->

        <p id="comportamientoInformacion"
           class="dato-mascota">

            Comportamiento: -

        </p>

        <!-- Presenta las actividades y preferencias de la mascota. -->

        <p id="gustosInformacion"
           class="dato-mascota">

            Gustos: -

        </p>

        <!-- Muestra los cuidados especiales que necesita la mascota. -->

        <p id="cuidadosInformacion"
           class="dato-mascota">

            Cuidados especiales: -

        </p>

    </div>

    <!-- ========================================== -->
    <!-- FORMULARIO PARA EDITAR INFORMACIÓN -->
    <!-- ========================================== -->

    <!-- Permite modificar los datos de la mascota cuando se activa la edición. -->

    <div id="formularioEdicion"
         class="formulario-mascota"
         style="display: none;">

        <h2 class="titulo-perfil-mascota text-center">

            Editar información

        </h2>

        <!-- Recopila los cambios que se guardarán en el perfil. -->

        <form id="formEditarMascota">

            <!-- Campo para modificar el nombre de la mascota. -->

            <div class="mb-3">

                <label for="editarNombre"
                       class="form-label">

                    Nombre

                </label>

                <input type="text"
                       id="editarNombre"
                       class="form-control"
                       required>

            </div>

            <!-- Campo para modificar la especie. -->

            <div class="mb-3">

                <label for="editarEspecie"
                       class="form-label">

                    Especie

                </label>

                <input type="text"
                       id="editarEspecie"
                       class="form-control"
                       required>

            </div>

            <!-- Campo para modificar la raza. -->

            <div class="mb-3">

                <label for="editarRaza"
                       class="form-label">

                    Raza

                </label>

                <input type="text"
                       id="editarRaza"
                       class="form-control"
                       required>

            </div>

            <!-- Campo para actualizar la fecha de nacimiento. -->

            <div class="mb-3">

                <label for="editarFechaNacimiento"
                       class="form-label">

                    Fecha de nacimiento

                </label>

                <input type="date"
                       id="editarFechaNacimiento"
                       class="form-control"
                       required>

            </div>

            <!-- Campo para editar las características de la mascota. -->

            <div class="mb-3">

                <label for="editarCaracteristicas"
                       class="form-label">

                    Características

                </label>

                <textarea id="editarCaracteristicas"
                          class="form-control"
                          rows="3"></textarea>

            </div>

            <!-- Campo para editar la descripción del comportamiento. -->

            <div class="mb-3">

                <label for="editarComportamiento"
                       class="form-label">

                    Comportamiento

                </label>

                <textarea id="editarComportamiento"
                          class="form-control"
                          rows="3"></textarea>

            </div>

            <!-- Campo para modificar los gustos y las preferencias. -->

            <div class="mb-3">

                <label for="editarGustos"
                       class="form-label">

                    Gustos

                </label>

                <textarea id="editarGustos"
                          class="form-control"
                          rows="3"></textarea>

            </div>

            <!-- Campo para actualizar los cuidados especiales. -->

            <div class="mb-3">

                <label for="editarCuidados"
                       class="form-label">

                    Cuidados especiales

                </label>

                <textarea id="editarCuidados"
                          class="form-control"
                          rows="3"></textarea>

            </div>

            <!-- Agrupa las opciones para guardar o cancelar la edición. -->

            <div class="text-center mt-4">

                <button type="submit"
                        class="btn-guardar">

                    Guardar cambios

                </button>

                <br>
                <br>

                <button type="button"
                        id="cancelarEdicion"
                        class="btn-cancelar">

                    Cancelar

                </button>

            </div>

        </form>

    </div>

    <!-- ========================================== -->
    <!-- ACCIONES -->
    <!-- ========================================== -->

    <!-- Agrupa las opciones disponibles para gestionar la mascota. -->

    <div id="accionesMascota"
         class="acciones-mascota">

        <!-- Permite activar el formulario de edición del perfil. -->

        <button type="button"
                id="editarInformacion"
                class="btn-perfil-mascota btn-editar">

            Editar información

        </button>

        <!-- ========================================== -->
        <!-- DOCUMENTOS E HISTORIAL -->
        <!-- ========================================== -->

        <!-- Contiene los accesos a los documentos y al historial médico. -->

        <div class="botones-mascota">

            <!-- Abre la sección de documentos de la mascota. -->

            <a id="enlaceDocumentos" href="documento.html"
               class="btn-perfil-mascota boton-grande-mascota">

                Documentos

            </a>

            <!-- Abre el historial médico de la mascota. -->

            <a id="enlaceHistorial" href="Historial_medico.html"
               class="btn-perfil-mascota boton-grande-mascota">

                Historial médico

            </a>

        </div>

    </div>

    <!-- ========================================== -->
    <!-- CHATBOT -->
    <!-- ========================================== -->

    <!-- Proporciona acceso al chatbot del módulo de comunidad. -->

    <a href="/Front%20end/Modulo_4_servicio_comunidad/chat_bot.html"
       class="boton-chatbot">

        Chatbot

    </a>

    <!-- Carga la lógica JavaScript para gestionar los datos y las acciones de las mascotas. -->

    <script src="/JS/mascota.js"></script>

    <!-- Carga la configuración global de la aplicación. -->

    <script src="/JS/configuracion_global.js"></script>

</body>

</html>
