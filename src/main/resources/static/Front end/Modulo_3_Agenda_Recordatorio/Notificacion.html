<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Carga el cliente encargado de las solicitudes a la API. -->

    <script src="/JS/api-client.js"></script>

    <!-- Configura la codificación de caracteres y la adaptación a dispositivos móviles. -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Define el título de la página en el navegador. -->

    <title>Notificaciones - My Pet</title>

    <!-- Importa Bootstrap para los estilos y componentes de la interfaz. -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Importa los estilos personalizados de My Pet. -->

    <link rel="stylesheet" href="../mi_pet.css">

</head>

<!-- Aplica el fondo y la altura mínima de la página. -->

<body class="fondo_pata min-vh-100">

    <!-- ===================================================== -->
    <!-- CONTENIDO PRINCIPAL -->
    <!-- ===================================================== -->

    <main class="container py-4">

        <!-- ===================================================== -->
        <!-- ENCABEZADO -->
        <!-- ===================================================== -->

        <!-- Presenta el título, la descripción y el acceso para regresar al inicio. -->

        <div class="position-relative text-center mb-4">

            <a
                href="../Modulo_1_gestion_usuario/home.html"
                class="flecha position-absolute start-0 top-50 translate-middle-y"
                aria-label="Regresar">

                ←

            </a>

            <h2 class="text-white mb-1">

                Notificaciones

            </h2>

            <p class="text-white mb-0">

                Mantente al día con el cuidado de tu mascota

            </p>

        </div>

        <!-- ===================================================== -->
        <!-- CONTENEDOR DE NOTIFICACIONES -->
        <!-- ===================================================== -->

        <!-- Agrupa la información, las acciones y la lista de notificaciones. -->

        <div class="notificaciones-contenedor">

            <!-- ===================================================== -->
            <!-- CABECERA -->
            <!-- ===================================================== -->

            <!-- Muestra el nombre de la sección y el contador de notificaciones. -->

            <div class="notificaciones-cabecera">

                <div>

                    <h5 class="mb-1">

                        Mis notificaciones

                    </h5>

                    <span id="contadorNotificaciones">

                        0 notificaciones

                    </span>

                </div>

                <!-- ===================================================== -->
                <!-- BOTONES DE GESTIÓN -->
                <!-- ===================================================== -->

                <!-- Agrupa las acciones para administrar las notificaciones. -->

                <div class="d-flex gap-2 flex-wrap justify-content-end">

                    <!-- Permite marcar todas las notificaciones como leídas. -->

                    <button
                        type="button"
                        id="btnMarcarTodasComoLeidas"
                        class="btn-notificaciones">

                        Marcar todas como leídas

                    </button>

                    <!-- Permite eliminar todas las notificaciones. -->

                    <button
                        type="button"
                        id="btnEliminarTodas"
                        class="btn-notificaciones">

                        Eliminar todas

                    </button>

                </div>

            </div>

            <!-- ===================================================== -->
            <!-- LISTA DE NOTIFICACIONES -->
            <!-- ===================================================== -->

            <!-- Contenedor donde JavaScript carga las notificaciones disponibles. -->

            <div
                id="listaNotificaciones"
                class="notificaciones-lista">

            </div>

            <!-- ===================================================== -->
            <!-- MENSAJE SIN NOTIFICACIONES -->
            <!-- ===================================================== -->

            <!-- Informa al usuario cuando no hay notificaciones para mostrar. -->

            <div
                id="mensajeSinNotificaciones"
                class="notificaciones-vacio">

                No tienes notificaciones por el momento.

            </div>

        </div>

    </main>

    <!-- ===================================================== -->
    <!-- BOOTSTRAP -->
    <!-- ===================================================== -->

    <!-- Carga los componentes interactivos de Bootstrap. -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- ===================================================== -->
    <!-- JAVASCRIPT DE NOTIFICACIONES -->
    <!-- ===================================================== -->

    <!-- Gestiona la carga, lectura y eliminación de las notificaciones. -->

    <script src="/JS/Notificacion.js"></script>

    <!-- Carga la configuración global de la aplicación. -->

    <script src="/JS/configuracion_global.js"></script>

</body>

</html>
