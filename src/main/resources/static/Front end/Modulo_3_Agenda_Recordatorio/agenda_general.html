<!DOCTYPE html>
<html lang="es">
<head>
    <script src="/JS/api-client.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda General - Mi Pet</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../mi_pet.css">
</head>
<body class="fondo_pata min-vh-100 d-flex flex-column justify-content-start">

    <!-- Encabezado y Navegación -->
    <header class="container-fluid pt-3 px-3 px-md-4">
        <div class="row align-items-center position-relative">
            <!-- Flecha alejada del borde izquierdo -->
            <div class="col-auto ps-2 ps-md-4">
                <a class="flecha" href="../Modulo_1_gestion_usuario/home.html" title="Volver al inicio">←</a>
            </div>
            
            <!-- Título Agenda -->
            <div class="col text-center titulo-naranja pe-4 pe-md-0">
                <h1>Agenda</h1>
            </div>
        </div>
    </header>

    <!-- Contenido PrincipalPegado al Título (mt-2) -->
    <main class="container mt-2 mt-md-3 mb-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 d-flex flex-column align-items-center gap-3 text-center">
                
                <!-- 1. Sección Seleccionar Fecha -->
                <div class="tarjeta_agenda p-3 p-md-4 w-100">
                    <h3 class="mb-2 mb-md-3 titulo_seccion">Seleccionar Fecha</h3>
                    <div class="w-100 px-1 d-flex justify-content-center">
                        <input type="date" id="calendario_principal" name="calendario_principal" class="form-control input_fecha_custom">
                    </div>
                </div>

                <!-- 2. Sección Ver Eventos de -->
                <div class="tarjeta_agenda p-3 p-md-4 w-100">
                    <h3 class="mb-3 titulo_seccion">Ver Eventos de:</h3>
                    <div id="mascotasAgenda" class="d-flex justify-content-center gap-2 gap-md-3 flex-wrap">
                        <p id="estadoMascotasAgenda" class="mb-0">Cargando mascotas...</p>
                    </div>
                </div>

                <div class="tarjeta_agenda p-3 p-md-4 w-100 text-start">
                    <h3 class="mb-3 titulo_seccion">Eventos del día</h3>
                    <p id="estadoAgenda" class="mb-2" aria-live="polite"></p>
                    <div id="eventosAgenda" class="d-grid gap-2"></div>
                </div>

                <!-- 3. Botón "+" Ubicado justo debajo de Ver Eventos -->
                <div class="mt-2">
                    <button type="button" 
                            class="btn_agregar_debajo" 
                            title="Agregar nuevo evento" 
                            id="btnNuevoEvento">
                        +
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- Ventana Modal para Registrar Evento -->
    <dialog id="dialogo_nuevo_evento" class="border-0 rounded-4 shadow-lg p-0">
        <div class="p-3 p-md-4 bg-white rounded-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 h4-md m-0 titulo_modal_naranja">Registrar Nuevo Evento</h2>
                <button type="button" class="btn-close" onclick="document.getElementById('dialogo_nuevo_evento').close()" aria-label="Cerrar"></button>
            </div>
            
            <form id="formNuevoEvento">
                <div class="mb-3 text-start">
                    <label for="nombre_mascota" class="form-label fw-bold">Mascota:</label>
                    <select id="mascotaEvento" name="mascota" class="form-select" required></select>
                </div>

                <div class="mb-3 text-start">
                    <label for="tipo_evento" class="form-label fw-bold">Tipo de Evento:</label>
                    <input type="text" id="tipoEvento" class="form-control" placeholder="Ej: Vacunación, Baño, Consulta" required>
                </div>

                <div class="mb-4 text-start">
                    <label for="fecha_evento" class="form-label fw-bold">Fecha:</label>
                    <input type="date" id="fechaEvento" class="form-control" required>
                </div>

                <div class="mb-4 text-start">
                    <label for="horaEvento" class="form-label fw-bold">Hora:</label>
                    <input type="time" id="horaEvento" class="form-control" required>
                </div>

                <div class="mb-4 text-start">
                    <label for="descripcionEvento" class="form-label fw-bold">Notas:</label>
                    <textarea id="descripcionEvento" class="form-control" maxlength="300" rows="3"></textarea>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <button type="button" id="cerrarDialogoEvento" class="btn btn-outline-secondary px-3 px-md-4 rounded-pill">Cancelar</button>
                    <button type="submit" value="guardar" class="btn btn-naranja-modal px-3 px-md-4 rounded-pill fw-bold">Guardar</button>
                </div>
            </form>
        </div>
    </dialog>

    <script src="/JS/agenda.js"></script>
    <script src="/JS/configuracion_global.js"></script>
</body>
</html>
