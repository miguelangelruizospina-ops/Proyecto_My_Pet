<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Carga el cliente encargado de las solicitudes a la API. -->

    <script src="/JS/api-client.js"></script>

    <!-- Configura la codificación de caracteres y la adaptación a dispositivos móviles. -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define el título de la página en el navegador. -->

    <title>Agenda Personalizada - Mi Pet</title>

    <!-- Importa Bootstrap para los estilos y componentes de la interfaz. -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Importa los estilos generales de My Pet. -->

    <link rel="stylesheet" href="../mi_pet.css">

</head>

<!-- Aplica el fondo general de la página. -->

<body class="fondo_pata">

    <!-- ===================================================== -->
    <!-- ENCABEZADO Y NAVEGACIÓN -->
    <!-- ===================================================== -->

    <header>

        <!-- Permite regresar a la agenda general. -->

        <a
            class="flecha"
            href="agenda_general.html"
            aria-label="Volver a la agenda general">

            ←

        </a>

        <!-- Muestra el título correspondiente a la agenda de la mascota seleccionada. -->

        <div class="titulo-naranja">

            <h1 id="tituloAgendaMascota">

                Agenda de mascota

            </h1>

        </div>

        <!-- ===================================================== -->
        <!-- CONTENEDOR PRINCIPAL DE LA AGENDA -->
        <!-- ===================================================== -->

        <div class="contenedor_agenda_personalizada">

            <main class="recuadro_gestion_evento">

                <!-- Informa el estado de carga y los resultados de la agenda. -->

                <p
                    id="estadoAgenda"
                    aria-live="polite">
                </p>

                <!-- Contenedor donde JavaScript muestra los eventos de la mascota. -->

                <section
                    id="eventosMascota"
                    class="d-grid gap-3">
                </section>

            </main>

            <!-- ===================================================== -->
            <!-- BOTÓN AGREGAR EVENTO -->
            <!-- ===================================================== -->

            <!-- Permite abrir el formulario para registrar una nueva actividad. -->

            <aside class="control_inferior">

                <div class="boton_agregar_a">

                    <button
                        type="button"
                        id="btnNuevoEvento"
                        class="btn_agregar_debajo"
                        title="Agregar nuevo evento"
                        aria-label="Agregar nuevo evento">

                        +

                    </button>

                </div>

            </aside>

        </div>

    </header>

    <!-- ===================================================== -->
    <!-- MODAL PARA REGISTRAR UN NUEVO EVENTO -->
    <!-- ===================================================== -->

    <!-- Presenta el formulario para programar una actividad en la agenda. -->

    <dialog id="dialogo_nuevo_evento">

        <div class="formulario_modal">

            <h2>Nuevo Evento</h2>

            <!-- Recopila los datos necesarios para registrar el evento. -->

            <form id="formNuevoEvento">

                <!-- Permite seleccionar la mascota asociada al evento. -->

                <label for="mascotaEvento">

                    Mascota:

                </label>

                <select
                    id="mascotaEvento"
                    required>
                </select>

                <!-- Permite indicar el tipo de actividad programada. -->

                <label for="tipoEvento">

                    Tipo:

                </label>

                <input
                    id="tipoEvento"
                    type="text"
                    placeholder="Ej: Peluquería"
                    required>

                <!-- Permite seleccionar la fecha del evento. -->

                <label for="fechaEvento">

                    Fecha:

                </label>

                <input
                    id="fechaEvento"
                    type="date"
                    required>

                <!-- Permite establecer la hora programada. -->

                <label for="horaEvento">

                    Hora:

                </label>

                <input
                    id="horaEvento"
                    type="time"
                    required>

                <!-- Permite agregar notas adicionales sobre la actividad. -->

                <label for="descripcionEvento">

                    Notas:

                </label>

                <textarea
                    id="descripcionEvento"
                    maxlength="300"
                    rows="3">
                </textarea>

                <!-- Agrupa las opciones para guardar el evento o cerrar el formulario. -->

                <div class="botones_form">

                    <button
                        type="submit">

                        Guardar

                    </button>

                    <button
                        type="button"
                        id="cerrarDialogoEvento">

                        Cerrar

                    </button>

                </div>

            </form>

        </div>

    </dialog>

    <!-- ===================================================== -->
    <!-- JAVASCRIPT DE LA AGENDA -->
    <!-- ===================================================== -->

    <!-- Gestiona la consulta, visualización y creación de eventos de la agenda. -->

    <script src="/JS/agenda.js"></script>

    <!-- Carga la configuración global de la aplicación. -->

    <script src="/JS/configuracion_global.js"></script>

</body>

</html>
