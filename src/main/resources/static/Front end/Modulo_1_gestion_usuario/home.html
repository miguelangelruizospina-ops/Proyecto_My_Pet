    <!-- =====================================================
         ESTILOS ESPECÍFICOS DEL HOME

         Estos estilos solamente organizan los botones
         inferiores de esta pantalla.
         ===================================================== -->

    <style>

        /* =====================================================
           BOTONES INFERIORES

           Organiza Panel administrativo y Ayuda en los
           extremos de la misma fila.
           ===================================================== */

        .botones-inferiores {

            display: flex;

            justify-content: space-between;

            align-items: center;

            width: 100%;

        }


        /* =====================================================
           TAMAÑO DE BOTONES INFERIORES

           Mantiene Panel administrativo y Ayuda con las
           mismas dimensiones.
           ===================================================== */

        .btn-inferior {

            width: 190px;

            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 0 10px;

        }


        /* =====================================================
           TEXTO DEL PANEL ADMINISTRATIVO

           Se reduce ligeramente para que el texto completo
           pueda mantenerse dentro del botón.
           ===================================================== */

        .texto-panel-admin {

            font-size: 14px;

            white-space: nowrap;

        }


        /* =====================================================
           TEXTO DE AYUDA

           Mantiene el tamaño normal del texto del botón.
           ===================================================== */

        .texto-ayuda {

            font-size: 16px;

        }


        /* =====================================================
           CONFIGURACIÓN

           Utiliza exactamente la misma clase que Cerrar sesión
           para conservar su tamaño, altura, tipografía,
           espaciado y comportamiento.

           Aquí solamente se modifica el color del botón.
           ===================================================== */

        .btn-configuracion {
            background-color: var(--mypet-orange) !important;
            border-color: var(--mypet-orange) !important;
            color: #030303 !important;

        }


        /* =====================================================
           CONFIGURACIÓN AL PASAR EL CURSOR

           Mantiene el botón naranja y el texto blanco.
           ===================================================== */

        .btn-configuracion:hover {
            background-color: var(--mypet-orange-hover) !important;
            border-color: var(--mypet-orange-hover) !important;
            color: #ffffff !important;

        }
        /* =====================================================
        CENTRAR CONFIGURACIÓN

        Centra el botón horizontalmente debajo de Cerrar sesión
        sin modificar su tamaño ni sus demás estilos.
        ===================================================== */

        .contenedor-configuracion {
            text-align: center;
        }
    </style>

    <!-- =====================================================
         VERIFICAR ROL DEL USUARIO

         Determina si el usuario actual es administrador
         y muestra el botón correspondiente.
         ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const btnPanelAdministrador =
                    document.getElementById(
                        "btnPanelAdministrador"
                    );


                if (!btnPanelAdministrador) {

                    return;

                }


                /* Obtener usuario almacenado. */

                const datosUsuario =
                    localStorage.getItem(
                        "usuarioLogueado"
                    );


                console.log(
                    "Datos guardados del usuario:",
                    datosUsuario
                );


                /* Si no existe usuario, no mostrar el botón. */

                if (!datosUsuario) {

                    console.log(
                        "No existe usuarioLogueado."
                    );

                    return;

                }


                let usuarioLogueado;


                /* Convertir el JSON almacenado nuevamente en objeto. */

                try {

                    usuarioLogueado =
                        JSON.parse(datosUsuario);

                } catch (error) {

                    console.error(
                        "Error al leer usuarioLogueado:",
                        error
                    );

                    return;

                }


                console.log(
                    "Usuario:",
                    usuarioLogueado
                );


                /* Obtener el rol. */

                let rol = "";


                if (
                    typeof usuarioLogueado ===
                    "string"
                ) {

                    rol =
                        usuarioLogueado;

                } else if (
                    usuarioLogueado
                ) {

                    rol =
                        usuarioLogueado.rol ||
                        usuarioLogueado.role ||
                        usuarioLogueado.nombreRol ||
                        usuarioLogueado.authority ||
                        usuarioLogueado.autoridad ||
                        "";

                }


                /* Normalizar el rol. */

                rol =
                    String(rol)
                        .trim()
                        .toLowerCase();


                console.log(
                    "Rol detectado:",
                    rol
                );


                /* Mostrar el botón si el usuario es administrador. */

                if (
                    rol === "administrador" ||
                    rol === "admin" ||
                    rol === "role_administrador" ||
                    rol === "role administrador" ||
                    rol.includes("administrador")
                ) {

                    btnPanelAdministrador.style.display =
                        "flex";


                    console.log(
                        "Panel administrativo habilitado."
                    );

                } else {

                    console.log(
                        "El usuario no es administrador."
                    );

                }

            }
        );

    </script>


    <!-- =====================================================
         CERRAR SESIÓN

         Elimina la sesión almacenada y regresa
         al formulario de inicio de sesión.
         ===================================================== -->

    <script>

        document
            .getElementById("btnCerrarSesion")
            .addEventListener(
                "click",
                function () {

                    const confirmar =
                        confirm(
                            "¿Está seguro de que desea cerrar sesión?"
                        );


                    if (!confirmar) {

                        return;

                    }


                    /* Eliminar sesión. */

                    localStorage.removeItem(
                        "usuarioLogueado"
                    );


                    /* Regresar al login. */

                    window.location.href =
                        "iniciar_sesion.html";

                }
            );

    </script>
