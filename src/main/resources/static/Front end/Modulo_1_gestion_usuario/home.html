    <!-- =====================================================
         VERIFICAR ROL DEL USUARIO
         ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const btnPanelAdministrador =
                    document.getElementById(
                        "btnPanelAdministrador"
                    );


                if (!btnPanelAdministrador) {
                    return;
                }


                /*
                 * Obtener usuario almacenado.
                 */

                const datosUsuario =
                    localStorage.getItem(
                        "usuarioLogueado"
                    );


                console.log(
                    "Datos guardados del usuario:",
                    datosUsuario
                );


                /*
                 * Si no existe usuario,
                 * no mostrar el botón.
                 */

                if (!datosUsuario) {

                    console.log(
                        "No existe usuarioLogueado."
                    );

                    return;
                }


                let usuarioLogueado;


                /*
                 * Convertir el JSON almacenado
                 * nuevamente en objeto.
                 */

                try {

                    usuarioLogueado =
                        JSON.parse(datosUsuario);

                } catch (error) {

                    console.error(
                        "Error al leer usuarioLogueado:",
                        error
                    );

                    return;
                }


                console.log(
                    "Usuario:",
                    usuarioLogueado
                );


                /*
                 * Obtener el rol.
                 */

                let rol = "";


                if (
                    typeof usuarioLogueado ===
                    "string"
                ) {

                    rol =
                        usuarioLogueado;

                } else if (
                    usuarioLogueado
                ) {

                    rol =
                        usuarioLogueado.rol ||
                        usuarioLogueado.role ||
                        usuarioLogueado.nombreRol ||
                        usuarioLogueado.authority ||
                        usuarioLogueado.autoridad ||
                        "";

                }


                /*
                 * Normalizar el rol.
                 */

                rol =
                    String(rol)
                        .trim()
                        .toLowerCase();


                console.log(
                    "Rol detectado:",
                    rol
                );


                /*
                 * Mostrar el botón
                 * si es administrador.
                 */

                if (
                    rol === "administrador" ||
                    rol === "admin" ||
                    rol === "role_administrador" ||
                    rol === "role administrador" ||
                    rol.includes("administrador")
                ) {

                    btnPanelAdministrador.style.display =
                        "flex";


                    console.log(
                        "Panel administrativo habilitado."
                    );

                } else {

                    console.log(
                        "El usuario no es administrador."
                    );

                }

            }
        );

    </script>


    <!-- =====================================================
         CERRAR SESIÓN
         ===================================================== -->

    <script>

        document
            .getElementById("btnCerrarSesion")
            .addEventListener(
                "click",
                function () {


                    const confirmar =
                        confirm(
                            "¿Está seguro de que desea cerrar sesión?"
                        );


                    if (!confirmar) {

                        return;

                    }


                    /*
                     * Eliminar sesión.
                     */

                    localStorage.removeItem(
                        "usuarioLogueado"
                    );


                    /*
                     * Regresar al login.
                     */

                    window.location.href =
                        "iniciar_sesion.html";

                }
            );

    </script>
