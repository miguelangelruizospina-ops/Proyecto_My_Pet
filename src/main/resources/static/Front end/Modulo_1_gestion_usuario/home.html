<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Configuración básica del documento y adaptación a dispositivos móviles. -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Carga Bootstrap para utilizar sus componentes y estilos generales. -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <title>Inicio</title>

    <!-- Carga los estilos generales compartidos por My Pet. -->

    <link
        rel="stylesheet"
        href="../mi_pet.css"
    >

    <!-- Define los estilos utilizados exclusivamente por la página de inicio. -->

    <style>

        /* Organiza los botones inferiores en los extremos de la misma fila. */

        .botones-inferiores {

            display: flex;

            justify-content: space-between;

            align-items: center;

            width: 100%;

        }

        /* Mantiene los botones inferiores con las mismas dimensiones. */

        .btn-inferior {

            width: 190px;

            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 0 10px;

        }

        /* Ajusta el tamaño del texto del botón administrativo. */

        .texto-panel-admin {

            font-size: 14px;

            white-space: nowrap;

        }

        /* Define el tamaño del texto del botón de ayuda. */

        .texto-ayuda {

            font-size: 16px;

        }

        /* Define el color del botón de configuración. */

        .btn-configuracion {
            background-color: var(--mypet-orange) !important;
            border-color: var(--mypet-orange) !important;
            color: #030303 !important;

        }

        /* Define el estado del botón de configuración cuando se pasa el cursor. */

        .btn-configuracion:hover {
            background-color: var(--mypet-orange-hover) !important;
            border-color: var(--mypet-orange-hover) !important;
            color: #ffffff !important;

        }

        /* Centra el botón de configuración debajo del botón de cierre de sesión. */

        .contenedor-configuracion {
            text-align: center;
        }

    </style>

</head>

<body class="fondo_pata">

    <!-- Permite acceder a las notificaciones de My Pet. -->

    <div class="notificaciones-inicio">

        <a
            href="../Modulo_3_Agenda_Recordatorio/Notificacion.html"
            class="btn-notificaciones"
            aria-label="Notificaciones"
            title="Notificaciones"
        >

            &#128276;

            <!-- Muestra el indicador de notificaciones de emergencias. -->

            <span
                id="indicadorNotificaciones"
                class="indicador-notificaciones"
                style="display: none;"
            >
            </span>

            <!-- Muestra el indicador de notificaciones de agenda. -->

            <span
                id="indicadorAgenda"
                class="indicador-agenda"
                style="display: none;"
            >
            </span>

        </a>

    </div>

    <!-- Contiene las funciones principales de My Pet. -->

    <div class="container my-5 pt-5">

        <div
            class="row justify-content-center text-center"
            style="row-gap: 80px;"
        >

            <!-- Permite acceder a la información del usuario. -->

            <div class="col-12 col-md-4 d-flex justify-content-center">

                <a
                    href="tu_usuario.html"
                    class="btn boton-naranja-ini btn-1"
                >
                    Tu usuario
                </a>

            </div>

            <!-- Permite acceder a la gestión de las mascotas. -->

            <div class="col-12 col-md-4 d-flex justify-content-center">

                <a
                    href="../Modulo_2_gestion_mascotas/mis_mascotas.html"
                    class="btn boton-naranja-ini btn-2"
                >
                    Tus mascotas
                </a>

            </div>

            <!-- Permite acceder al foro de la comunidad. -->

            <div class="col-12 col-md-4 d-flex justify-content-center">

                <a
                    href="../Modulo_4_servicio_comunidad/foro.html"
                    class="btn boton-naranja-ini btn-3"
                >
                    Foro
                </a>

            </div>

            <!-- Permite acceder a la agenda general. -->

            <div class="col-12 col-md-4 d-flex justify-content-center">

                <a
                    href="../Modulo_3_Agenda_Recordatorio/agenda_general.html"
                    class="btn boton-naranja-ini btn-4"
                >
                    Agenda
                </a>

            </div>

            <!-- Permite acceder al mapa de emergencias. -->

            <div class="col-12 col-md-4 d-flex justify-content-center">

                <a
                    href="/Front%20end/Modulo_5_emergencia/mapa.html"
                    class="btn boton-naranja-ini btn-5"
                    target="_blank"
                >
                    Mapa
                </a>

            </div>

            <!-- Permite acceder a la gestión de emergencias. -->

            <div class="col-12 col-md-4 d-flex justify-content-center">

                <a
                    href="../Modulo_5_emergencia/emergencia.html"
                    class="btn boton-naranja-ini btn-6"
                >
                    Emergencias
                </a>

            </div>

        </div>

        <!-- Organiza los botones secundarios de administración y ayuda. -->

        <div class="text-center mt-5">

            <!-- Muestra el acceso al panel administrativo y a la sección de ayuda. -->

            <div class="botones-inferiores">

                <!-- Muestra el panel administrativo únicamente a los usuarios autorizados. -->

                <a
                    href="admin.html"
                    id="btnPanelAdministrador"
                    class="btn boton-naranja-ini btn-inferior"
                    style="display: none;"
                >

                    <span class="texto-panel-admin">
                        Panel administrativo
                    </span>

                </a>

                <!-- Permite acceder a la sección de ayuda. -->

                <a
                    href="ayuda.html"
                    class="btn boton-naranja-ini btn-inferior"
                >

                    <span class="texto-ayuda">
                        Ayuda
                    </span>

                </a>

            </div>

            <!-- Permite cerrar la sesión del usuario actual. -->

            <div class="mt-4">

                <button
                    type="button"
                    id="btnCerrarSesion"
                    class="btn btn-cerrar-sesion"
                >
                    Cerrar sesión
                </button>

            </div>

            <!-- Permite acceder a la configuración de My Pet. -->

            <div class="mt-2 contenedor-configuracion">

                <a
                    href="configuracion.html"
                    class="btn btn-cerrar-sesion btn-configuracion"
                >
                    Configuración
                </a>

            </div>

        </div>

    </div>

    <!-- Carga el indicador de notificaciones de emergencias. -->

    <script src="/JS/notificacion_indicador.js"></script>

    <!-- Carga el indicador de notificaciones de agenda. -->

    <script src="/JS/notificacion_agenda.js"></script>

    <!-- Verifica el rol del usuario y controla la visibilidad del panel administrativo. -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const btnPanelAdministrador =
                    document.getElementById(
                        "btnPanelAdministrador"
                    );

                if (!btnPanelAdministrador) {

                    return;

                }

                // Obtiene la información del usuario almacenada en el navegador.

                const datosUsuario =
                    localStorage.getItem(
                        "usuarioLogueado"
                    );

                console.log(
                    "Datos guardados del usuario:",
                    datosUsuario
                );

                // Verifica que exista una sesión almacenada.

                if (!datosUsuario) {

                    console.log(
                        "No existe usuarioLogueado."
                    );

                    return;

                }

                let usuarioLogueado;

                // Convierte la información almacenada en formato JSON a un objeto.

                try {

                    usuarioLogueado =
                        JSON.parse(datosUsuario);

                } catch (error) {

                    console.error(
                        "Error al leer usuarioLogueado:",
                        error
                    );

                    return;

                }

                console.log(
                    "Usuario:",
                    usuarioLogueado
                );

                // Obtiene el rol registrado para el usuario.

                let rol = "";

                if (
                    typeof usuarioLogueado ===
                    "string"
                ) {

                    rol =
                        usuarioLogueado;

                } else if (
                    usuarioLogueado
                ) {

                    rol =
                        usuarioLogueado.rol ||
                        usuarioLogueado.role ||
                        usuarioLogueado.nombreRol ||
                        usuarioLogueado.authority ||
                        usuarioLogueado.autoridad ||
                        "";

                }

                // Normaliza el rol para facilitar su comparación.

                rol =
                    String(rol)
                        .trim()
                        .toLowerCase();

                console.log(
                    "Rol detectado:",
                    rol
                );

                // Muestra el panel administrativo cuando el usuario tiene permisos de administrador.

                if (
                    rol === "administrador" ||
                    rol === "admin" ||
                    rol === "role_administrador" ||
                    rol === "role administrador" ||
                    rol.includes("administrador")
                ) {

                    btnPanelAdministrador.style.display =
                        "flex";

                    console.log(
                        "Panel administrativo habilitado."
                    );

                } else {

                    console.log(
                        "El usuario no es administrador."
                    );

                }

            }
        );

    </script>

    <!-- Gestiona el cierre de sesión y regresa al inicio de sesión. -->

    <script>

        document
            .getElementById("btnCerrarSesion")
            .addEventListener(
                "click",
                function () {

                    const confirmar =
                        confirm(
                            "¿Está seguro de que desea cerrar sesión?"
                        );

                    if (!confirmar) {

                        return;

                    }

                    // Elimina la información de la sesión almacenada.

                    localStorage.removeItem(
                        "usuarioLogueado"
                    );

                    // Regresa al formulario de inicio de sesión.

                    window.location.href =
                        "iniciar_sesion.html";

                }
            );

    </script>

    <!-- Carga la configuración global de My Pet. -->

    <script src="/JS/configuracion_global.js"></script>

</body>

</html>
