<!DOCTYPE html>
<html lang="es">
<head>
    <script src="/JS/api-client.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Cambiar contraseña</title>

    <link rel="stylesheet" href="../mi_pet.css">
</head>

<body class="fondo_pata">

    <a class="flecha" href="iniciar_sesion.html">←</a>

    <header>

        <div class="titulo-naranja">
            <h1>Cambiar contraseña</h1>
        </div>

        <div class="inicia_sesi">

            <h2>Correo</h2>
            <input
                type="email"
                id="correoRecuperacion"
                required
            >

            <h2>Contraseña actual</h2>
            <input
                type="password"
                id="contrasenaActual"
                autocomplete="current-password"
                required
            >

            <h2>Nueva contraseña</h2>
            <input
                type="password"
                id="nuevaContrasena"
                required
            >

            <h2>Confirmar contraseña</h2>
            <input
                type="password"
                id="confirmarContrasena"
                required
            >

            <h2>Verificación de seguridad</h2>

            <p id="captchaPregunta"></p>

            <input
                type="text"
                id="captchaRespuesta"
                placeholder="Escribe la respuesta"
                required
            >

            <br><br>

            <div id="mensajeRecuperacion"></div>

        </div>

    </header>

    <div class="padre-naranja">

        <button
            type="button"
            class="boton-naranja"
            id="btnCambiarContrasena">
            Cambiar contraseña
        </button>

    </div>

    <script src="/JS/recu_contrasena.js"></script>
    <script src="/JS/configuracion_global.js"></script>

</body>
</html>
