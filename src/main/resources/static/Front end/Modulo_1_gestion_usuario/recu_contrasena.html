<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Carga el cliente de conexión con la API. -->

    <script src="/JS/api-client.js"></script>

    <!-- Configura el documento y su adaptación a dispositivos móviles. -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Carga Bootstrap para utilizar sus estilos y componentes. -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Cambiar contraseña</title>

    <!-- Carga los estilos generales de My Pet. -->

    <link rel="stylesheet" href="../mi_pet.css">
</head>

<body class="fondo_pata">

    <!-- Permite regresar a la página de inicio de sesión. -->

    <a class="flecha" href="iniciar_sesion.html">←</a>

    <header>

        <!-- Presenta el formulario para cambiar la contraseña. -->

        <div class="titulo-naranja">
            <h1>Cambiar contraseña</h1>
        </div>

        <div class="inicia_sesi">

            <!-- Solicita el correo asociado a la cuenta. -->

            <h2>Correo</h2>
            <input
                type="email"
                id="correoRecuperacion"
                required
            >

            <!-- Solicita la contraseña actual del usuario. -->

            <h2>Contraseña actual</h2>
            <input
                type="password"
                id="contrasenaActual"
                autocomplete="current-password"
                required
            >

            <!-- Solicita la nueva contraseña. -->

            <h2>Nueva contraseña</h2>
            <input
                type="password"
                id="nuevaContrasena"
                required
            >

            <!-- Solicita la confirmación de la nueva contraseña. -->

            <h2>Confirmar contraseña</h2>
            <input
                type="password"
                id="confirmarContrasena"
                required
            >

            <!-- Presenta la verificación de seguridad. -->

            <h2>Verificación de seguridad</h2>

            <p id="captchaPregunta"></p>

            <input
                type="text"
                id="captchaRespuesta"
                placeholder="Escribe la respuesta"
                required
            >

            <br><br>

            <!-- Muestra los mensajes del proceso de cambio de contraseña. -->

            <div id="mensajeRecuperacion"></div>

        </div>

    </header>

    <!-- Presenta el botón para confirmar el cambio de contraseña. -->

    <div class="padre-naranja">

        <button
            type="button"
            class="boton-naranja"
            id="btnCambiarContrasena">
            Cambiar contraseña
        </button>

    </div>

    <!-- Carga la lógica para cambiar la contraseña. -->

    <script src="/JS/recu_contrasena.js"></script>

    <!-- Carga la configuración global de My Pet. -->

    <script src="/JS/configuracion_global.js"></script>

</body>

</html>
