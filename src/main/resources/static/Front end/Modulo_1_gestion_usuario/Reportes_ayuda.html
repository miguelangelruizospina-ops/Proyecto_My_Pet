<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configura el documento y su adaptación a dispositivos móviles. -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reportes de ayuda - Mi Pet</title>

    <!-- Carga Bootstrap para utilizar sus estilos y componentes. -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Carga los estilos generales de My Pet. -->

    <link rel="stylesheet" href="../mi_pet.css">
</head>

<body class="fondo_pata min-vh-100 d-flex flex-column">

    <!-- Presenta el encabezado y el acceso al panel administrativo. -->

    <header class="container-fluid pt-3 px-4 px-md-5">

        <div class="row align-items-center">

            <div class="col-auto">

                <a
                    class="flecha text-decoration-none"
                    href="admin.html"
                    title="Volver al panel administrativo"
                >
                    ←
                </a>

            </div>

            <div class="col text-center titulo-naranja">

                <h1>Reportes de ayuda</h1>

            </div>

            <div class="col-auto">
            </div>

        </div>

    </header>

    <!-- Organiza el contenido principal de la página. -->

    <main class="container mt-4 mb-5">

        <div class="row justify-content-center">

            <div class="col-12 col-xl-10">

                <!-- Describe la función de la sección de reportes. -->

                <div class="tarjeta_agenda p-4 mb-4 text-center">

                    <h2 class="titulo_seccion">
                        Reportes enviados por los usuarios
                    </h2>

                    <p class="mb-0">
                        Consulta los problemas reportados y gestiona su respuesta.
                    </p>

                </div>

                <!-- Informa que los reportes se están cargando. -->

                <div
                    id="mensajeCarga"
                    class="tarjeta_agenda p-4 text-center"
                >
                    <p class="mb-0">
                        Cargando reportes...
                    </p>
                </div>

                <!-- Muestra los errores durante la carga de los reportes. -->

                <div
                    id="mensajeError"
                    class="alert alert-danger d-none"
                    role="alert"
                >
                </div>

                <!-- Contiene los reportes enviados por los usuarios. -->

                <div id="contenedorReportes"></div>

                <!-- Informa cuando no existen reportes registrados. -->

                <div
                    id="mensajeSinReportes"
                    class="tarjeta_agenda p-4 text-center d-none"
                >

                    <h3 class="titulo_seccion">
                        No hay reportes
                    </h3>

                    <p class="mb-0">
                        Actualmente no hay problemas reportados por los usuarios.
                    </p>

                </div>

            </div>

        </div>

    </main>

    <!-- Permite consultar y gestionar los detalles de cada reporte. -->

    <div
        class="modal fade"
        id="modalReporte"
        tabindex="-1"
        aria-labelledby="tituloModalReporte"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content formulario_modal">

                <div class="modal-header">

                    <h5
                        class="modal-title titulo_seccion"
                        id="tituloModalReporte"
                    >
                        Gestionar reporte
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    ></button>

                </div>

                <div class="modal-body">

                    <!-- Muestra el usuario que envió el reporte. -->

                    <div class="mb-3">

                        <label
                            for="reporteUsuario"
                            class="form-label"
                        >
                            Usuario
                        </label>

                        <input
                            type="text"
                            id="reporteUsuario"
                            class="form-control"
                            readonly
                        >

                    </div>

                    <!-- Muestra la fecha de creación del reporte. -->

                    <div class="mb-3">

                        <label
                            for="reporteFecha"
                            class="form-label"
                        >
                            Fecha
                        </label>

                        <input
                            type="text"
                            id="reporteFecha"
                            class="form-control"
                            readonly
                        >

                    </div>

                    <!-- Identifica la página donde ocurrió el problema. -->

                    <div class="mb-3">

                        <label
                            for="reportePagina"
                            class="form-label"
                        >
                            Página
                        </label>

                        <input
                            type="text"
                            id="reportePagina"
                            class="form-control"
                            readonly
                        >

                    </div>

                    <!-- Muestra la información del navegador del usuario. -->

                    <div class="mb-3">

                        <label
                            for="reporteNavegador"
                            class="form-label"
                        >
                            Navegador
                        </label>

                        <textarea
                            id="reporteNavegador"
                            class="form-control"
                            rows="2"
                            readonly
                        ></textarea>

                    </div>

                    <!-- Presenta la descripción original del problema. -->

                    <div class="mb-3">

                        <label
                            for="reporteDescripcion"
                            class="form-label"
                        >
                            Descripción del problema
                        </label>

                        <textarea
                            id="reporteDescripcion"
                            class="form-control"
                            rows="5"
                            readonly
                        ></textarea>

                    </div>

                    <!-- Separa los datos del reporte de las opciones de gestión. -->

                    <hr>

                    <!-- Permite actualizar el estado del reporte. -->

                    <div class="mb-3">

                        <label
                            for="reporteEstado"
                            class="form-label"
                        >
                            Estado
                        </label>

                        <select
                            id="reporteEstado"
                            class="form-select"
                        >

                            <option value="pendiente">
                                Pendiente
                            </option>

                            <option value="en_revision">
                                En revisión
                            </option>

                            <option value="solucionado">
                                Solucionado
                            </option>

                        </select>

                    </div>

                    <!-- Permite redactar una respuesta para el usuario. -->

                    <div class="mb-3">

                        <label
                            for="reporteRespuesta"
                            class="form-label"
                        >
                            Respuesta al usuario
                        </label>

                        <textarea
                            id="reporteRespuesta"
                            class="form-control"
                            rows="5"
                            maxlength="2000"
                            placeholder="Escribe aquí la respuesta para el usuario..."
                        ></textarea>

                    </div>

                    <!-- Muestra los mensajes del proceso de gestión. -->

                    <div
                        id="mensajeModal"
                        class="alert d-none"
                        role="alert"
                    >
                    </div>

                </div>

                <!-- Presenta las acciones para cancelar o guardar los cambios. -->

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        id="btnGuardarReporte"
                        class="btn-guardar"
                    >
                        Guardar cambios
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Carga Bootstrap para gestionar el modal y sus componentes interactivos. -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Carga el cliente de conexión con la API. -->

    <script src="../api-client.js"></script>

    <!-- Carga la lógica para consultar y gestionar los reportes de ayuda. -->

    <script src="/JS/Reportes_ayuda.js"></script>

    <!-- Carga la configuración global de My Pet. -->

    <script src="/JS/configuracion_global.js"></script>

</body>

</html>
