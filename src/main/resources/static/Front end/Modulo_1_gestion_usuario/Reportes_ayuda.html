<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reportes de ayuda - Mi Pet</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../mi_pet.css">
</head>

<body class="fondo_pata min-vh-100 d-flex flex-column">

    <!-- ENCABEZADO -->
    <header class="container-fluid pt-3 px-4 px-md-5">

        <div class="row align-items-center">

            <div class="col-auto">

                <a
                    class="flecha text-decoration-none"
                    href="admin.html"
                    title="Volver al panel administrativo"
                >
                    ←
                </a>

            </div>

            <div class="col text-center titulo-naranja">

                <h1>Reportes de ayuda</h1>

            </div>

            <div class="col-auto">
            </div>

        </div>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="container mt-4 mb-5">

        <div class="row justify-content-center">

            <div class="col-12 col-xl-10">


                <!-- ENCABEZADO DE LA SECCIÓN -->
                <div class="tarjeta_agenda p-4 mb-4 text-center">

                    <h2 class="titulo_seccion">
                        Reportes enviados por los usuarios
                    </h2>

                    <p class="mb-0">
                        Consulta los problemas reportados y gestiona su respuesta.
                    </p>

                </div>


                <!-- MENSAJE DE CARGA -->
                <div
                    id="mensajeCarga"
                    class="tarjeta_agenda p-4 text-center"
                >
                    <p class="mb-0">
                        Cargando reportes...
                    </p>
                </div>


                <!-- MENSAJE DE ERROR -->
                <div
                    id="mensajeError"
                    class="alert alert-danger d-none"
                    role="alert"
                >
                </div>


                <!-- CONTENEDOR DE REPORTES -->
                <div id="contenedorReportes"></div>


                <!-- MENSAJE CUANDO NO HAY REPORTES -->
                <div
                    id="mensajeSinReportes"
                    class="tarjeta_agenda p-4 text-center d-none"
                >

                    <h3 class="titulo_seccion">
                        No hay reportes
                    </h3>

                    <p class="mb-0">
                        Actualmente no hay problemas reportados por los usuarios.
                    </p>

                </div>


            </div>

        </div>

    </main>


    <!-- MODAL PARA GESTIONAR REPORTE -->
    <div
        class="modal fade"
        id="modalReporte"
        tabindex="-1"
        aria-labelledby="tituloModalReporte"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content formulario_modal">

                <div class="modal-header">

                    <h5
                        class="modal-title titulo_seccion"
                        id="tituloModalReporte"
                    >
                        Gestionar reporte
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    ></button>

                </div>


                <div class="modal-body">

                    <!-- INFORMACIÓN DEL REPORTE -->

                    <div class="mb-3">

                        <label
                            for="reporteUsuario"
                            class="form-label"
                        >
                            Usuario
                        </label>

                        <input
                            type="text"
                            id="reporteUsuario"
                            class="form-control"
                            readonly
                        >

                    </div>


                    <!-- FECHA -->

                    <div class="mb-3">

                        <label
                            for="reporteFecha"
                            class="form-label"
                        >
                            Fecha
                        </label>

                        <input
                            type="text"
                            id="reporteFecha"
                            class="form-control"
                            readonly
                        >

                    </div>


                    <!-- PÁGINA -->

                    <div class="mb-3">

                        <label
                            for="reportePagina"
                            class="form-label"
                        >
                            Página
                        </label>

                        <input
                            type="text"
                            id="reportePagina"
                            class="form-control"
                            readonly
                        >

                    </div>


                    <!-- NAVEGADOR -->

                    <div class="mb-3">

                        <label
                            for="reporteNavegador"
                            class="form-label"
                        >
                            Navegador
                        </label>

                        <textarea
                            id="reporteNavegador"
                            class="form-control"
                            rows="2"
                            readonly
                        ></textarea>

                    </div>


                    <!-- DESCRIPCIÓN -->

                    <div class="mb-3">

                        <label
                            for="reporteDescripcion"
                            class="form-label"
                        >
                            Descripción del problema
                        </label>

                        <textarea
                            id="reporteDescripcion"
                            class="form-control"
                            rows="5"
                            readonly
                        ></textarea>

                    </div>


                    <!-- GESTIÓN DEL ADMINISTRADOR -->

                    <hr>


                    <div class="mb-3">

                        <label
                            for="reporteEstado"
                            class="form-label"
                        >
                            Estado
                        </label>

                        <select
                            id="reporteEstado"
                            class="form-select"
                        >

                            <option value="pendiente">
                                Pendiente
                            </option>

                            <option value="en_revision">
                                En revisión
                            </option>

                            <option value="solucionado">
                                Solucionado
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label
                            for="reporteRespuesta"
                            class="form-label"
                        >
                            Respuesta al usuario
                        </label>

                        <textarea
                            id="reporteRespuesta"
                            class="form-control"
                            rows="5"
                            maxlength="2000"
                            placeholder="Escribe aquí la respuesta para el usuario..."
                        ></textarea>

                    </div>


                    <div
                        id="mensajeModal"
                        class="alert d-none"
                        role="alert"
                    >
                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        id="btnGuardarReporte"
                        class="btn-guardar"
                    >
                        Guardar cambios
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- BOOTSTRAP -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- CLIENTE API -->
    <script src="../api-client.js"></script>


    <!-- JAVASCRIPT DE REPORTES -->
    <script src="/JS/Reportes_ayuda.js"></script>
    <script src="/JS/configuracion_global.js"></script>
</body>

</html>
