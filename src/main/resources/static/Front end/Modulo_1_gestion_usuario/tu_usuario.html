<!DOCTYPE html>
<html lang="es">

<head>
    <script src="/JS/api-client.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>Tu usuario</title>

    <link rel="stylesheet" href="../mi_pet.css">

<!--
    ESTILOS ESPECÍFICOS DE LA VISTA "TU USUARIO"
    Se mantiene aquí para separar los estilos propios de esta
    página de los estilos generales utilizados en el proyecto.
-->
    <style>

        .tarjeta-usuario {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 20px;
            margin-top: 10px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .titulo-perfil {
            color: var(--mypet-orange) !important;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .dato-usuario {
            color: #000000  !important;
            font-size: 17px;
            margin: 10px 0;
        }

        .formulario-usuario {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .formulario-usuario label {
            color: white !important;
            font-weight: bold;
        }

        .btn-guardar {
            background-color: var(--mypet-orange) !important;
            color: #ffffff !important;
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-guardar:hover {
            opacity: 0.9;
        }

        .btn-cancelar {
            background: transparent;
            border: none;
            color: white !important;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-perfil {
        background-color: var(--mypet-orange) !important;
        color: #000000 !important;
        border: none;
        border-radius: 10px;
        padding: 10px 25px;
        text-decoration: none;
        font-weight: bold;
        display: inline-block;
        cursor: pointer;
    }

        .btn-perfil:hover {
            opacity: 0.9;
            color: black !important;
        }

        .enlace-perfil {
            color: white !important;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .enlace-perfil:hover {
            text-decoration: underline;
        }

        .acciones-perfil {
            margin-top: 18px;
            margin-bottom: 25px;
        }

    </style>

</head>


<body class="fondo_pata min-vh-100 d-flex flex-column align-items-center py-3">


    <!-- FLECHA PARA VOLVER -->

    <div class="w-100 px-4">

        <a class="flecha text-decoration-none"
           href="home.html">

            ←

        </a>

    </div>


    <!-- FOTO Y NOMBRE -->

    <header class="text-center d-flex flex-column align-items-center my-2">

        <label for="input-foto-perfil"
               class="marco-foto-per"
               title="Haz clic para cambiar tu foto">

            <img src="../fotos/ana.jpg"
                 alt="Foto de perfil"
                 id="fotoPerfil">

            <input type="file"
                   id="input-foto-perfil"
                   class="d-none"
                   accept="image/*">

            <div class="overlay-cambiar-foto">

                <span>Cambiar foto</span>

            </div>

        </label>


        <h1 id="usu-cen-h1"
            class="mt-3"
            style="color: white !important;">

        </h1>

    </header>


    <!-- ========================================== -->
    <!-- INFORMACIÓN DEL USUARIO -->
    <!-- ========================================== -->

    <div id="informacionUsuario"
         class="tarjeta-usuario">

        <h2 class="titulo-perfil text-center">
            Información de usuario
        </h2>


        <p id="nombreUsuario"
           class="dato-usuario">

            Nombre: -

        </p>


        <p id="apellidosUsuario"
           class="dato-usuario">

            Apellidos: -

        </p>


        <p id="correoUsuario"
           class="dato-usuario">

            Correo: -

        </p>


        <p id="usuarioUsuario"
           class="dato-usuario">

            Usuario: -

        </p>


        <p id="rolUsuario"
           class="dato-usuario">

            Rol: -

        </p>


        <p id="fechaUsuario"
           class="dato-usuario">

            Fecha de creación: -

        </p>


        <hr>


        <p id="biografiaUsuario"
           class="dato-usuario">

            Biografía: -

        </p>


        <p id="telefonoUsuario"
           class="dato-usuario">

            Teléfono: -

        </p>


        <p id="ciudadUsuario"
           class="dato-usuario">

            Ciudad: -

        </p>


        <p id="generoUsuario"
           class="dato-usuario">

            Género: -

        </p>


        <p id="fechaNacimientoUsuario"
           class="dato-usuario">

            Fecha de nacimiento: -

        </p>

    </div>


    <!-- ========================================== -->
    <!-- FORMULARIO PARA EDITAR INFORMACIÓN -->
    <!-- ========================================== -->

    <div id="formularioEdicion"
         class="formulario-usuario"
         style="display: none;">

        <h2 id="tituloFormularioPerfil" class="titulo-perfil text-center">

            Editar información

        </h2>


        <form id="formEditarPerfil">


            <div class="mb-3">

                <label for="editarNombre"
                       class="form-label">

                    Nombre

                </label>

                <input type="text"
                       id="editarNombre"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                <label for="editarApellidos"
                       class="form-label">

                    Apellidos

                </label>

                <input type="text"
                       id="editarApellidos"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                <label for="editarUsuario"
                       class="form-label">

                    Usuario

                </label>

                <input type="text"
                       id="editarUsuario"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                <label for="editarCorreo"
                       class="form-label">

                    Correo

                </label>

                <input type="email"
                       id="editarCorreo"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                <label for="editarBiografia"
                       class="form-label">

                    Biografía

                </label>

                <textarea id="editarBiografia"
                          class="form-control"
                          rows="3"
                          required></textarea>

            </div>


            <div class="mb-3">

                <label for="editarTelefono"
                       class="form-label">

                    Teléfono

                </label>

                <input type="text"
                       id="editarTelefono"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                <label for="editarCiudad"
                       class="form-label">

                    Ciudad

                </label>

                <input type="text"
                       id="editarCiudad"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                <label for="editarGenero"
                       class="form-label">

                    Género

                </label>

                <input type="text"
                       id="editarGenero"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                <label for="editarFechaNacimiento"
                       class="form-label">

                    Fecha de nacimiento

                </label>

                <input type="date"
                       id="editarFechaNacimiento"
                       class="form-control"
                       required>

            </div>


            <!-- BOTONES -->

            <div class="text-center mt-4">

                <button type="submit"
                        class="btn-guardar">

                    Guardar cambios

                </button>


                <br>
                <br>


                <button type="button"
                        id="cancelarEdicion"
                        class="btn-cancelar">

                    Cancelar

                </button>

            </div>


        </form>

    </div>


    <!-- ========================================== -->
    <!-- ACCIONES -->
    <!-- ========================================== -->

    <div id="accionesUsuario"
         class="d-flex flex-column align-items-center gap-2 acciones-perfil">


        <!-- EDITAR INFORMACIÓN -->

        <button type="button"
                id="editarInformacion"
                class="btn-perfil">
               
            Editar información

        </button>

        <button type="button"
                id="agregarInformacion"
                class="btn-perfil"
                hidden>

            Agregar información

        </button>


        <!-- VER MASCOTAS -->

        <a href="../Modulo_2_gestion_mascotas/mis_mascotas.html"
           id="verMascotas"
           class="btn-perfil">

            Ver mis mascotas

        </a>


        <!-- CAMBIAR CONTRASEÑA -->

        <a href="recu_contrasena.html"
           class="enlace-perfil">

            Cambiar contraseña

        </a>


        <!-- CERRAR SESIÓN -->

        <a href="iniciar_sesion.html"
           id="cerrarSesion"
           class="enlace-perfil">

            Cerrar sesión

        </a>

    </div>
<!-- JavaScript de la página -->
     <script src="/JS/usuario.js"></script>

     <script src="/JS/configuracion_global.js"></script>
     
</body>

</html>
