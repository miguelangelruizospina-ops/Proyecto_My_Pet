<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Carga el cliente de conexión con la API. -->

    <script src="/JS/api-client.js"></script>

    <!-- Configura el documento y su adaptación a dispositivos móviles. -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Carga Bootstrap para utilizar sus estilos y componentes. -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>Tu usuario</title>

    <!-- Carga los estilos generales de My Pet. -->

    <link rel="stylesheet" href="../mi_pet.css">

    <!-- Define los estilos específicos de la vista del usuario. -->

    <style>

        .tarjeta-usuario {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 20px;
            margin-top: 10px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .titulo-perfil {
            color: var(--mypet-orange) !important;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .dato-usuario {
            color: #000000  !important;
            font-size: 17px;
            margin: 10px 0;
        }

        .formulario-usuario {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .formulario-usuario label {
            color: white !important;
            font-weight: bold;
        }

        .btn-guardar {
            background-color: var(--mypet-orange) !important;
            color: #ffffff !important;
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-guardar:hover {
            opacity: 0.9;
        }

        .btn-cancelar {
            background: transparent;
            border: none;
            color: white !important;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-perfil {
            background-color: var(--mypet-orange) !important;
            color: #000000 !important;
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            cursor: pointer;
        }

        .btn-perfil:hover {
            opacity: 0.9;
            color: black !important;
        }

        .enlace-perfil {
            color: white !important;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .enlace-perfil:hover {
            text-decoration: underline;
        }

        .acciones-perfil {
            margin-top: 18px;
            margin-bottom: 25px;
        }

    </style>

</head>

<body class="fondo_pata min-vh-100 d-flex flex-column align-items-center py-3">

    <!-- Permite regresar a la página principal del usuario. -->

    <div class="w-100 px-4">

        <a class="flecha text-decoration-none"
           href="home.html">

            ←

        </a>

    </div>

    <!-- Presenta la foto de perfil y el nombre del usuario. -->

    <header class="text-center d-flex flex-column align-items-center my-2">

        <label for="input-foto-perfil"
               class="marco-foto-per"
               title="Haz clic para cambiar tu foto">

            <img src="../fotos/ana.jpg"
                 alt="Foto de perfil"
                 id="fotoPerfil">

            <input type="file"
                   id="input-foto-perfil"
                   class="d-none"
                   accept="image/*">

            <div class="overlay-cambiar-foto">

                <span>Cambiar foto</span>

            </div>

        </label>

        <h1 id="usu-cen-h1"
            class="mt-3"
            style="color: white !important;">

        </h1>

    </header>

    <!-- Muestra la información personal y los datos de la cuenta. -->

    <div id="informacionUsuario"
         class="tarjeta-usuario">

        <h2 class="titulo-perfil text-center">
            Información de usuario
        </h2>

        <p id="nombreUsuario"
           class="dato-usuario">

            Nombre: -

        </p>

        <p id="apellidosUsuario"
           class="dato-usuario">

            Apellidos: -

        </p>

        <p id="correoUsuario"
           class="dato-usuario">

            Correo: -

        </p>

        <p id="usuarioUsuario"
           class="dato-usuario">

            Usuario: -

        </p>

        <p id="rolUsuario"
           class="dato-usuario">

            Rol: -

        </p>

        <p id="fechaUsuario"
           class="dato-usuario">

            Fecha de creación: -

        </p>

        <hr>

        <p id="biografiaUsuario"
           class="dato-usuario">

            Biografía: -

        </p>

        <p id="telefonoUsuario"
           class="dato-usuario">

            Teléfono: -

        </p>

        <p id="ciudadUsuario"
           class="dato-usuario">

            Ciudad: -

        </p>

        <p id="generoUsuario"
           class="dato-usuario">

            Género: -

        </p>

        <p id="fechaNacimientoUsuario"
           class="dato-usuario">

            Fecha de nacimiento: -

        </p>

    </div>

    <!-- Contiene los campos para editar la información personal. -->

    <div id="formularioEdicion"
         class="formulario-usuario"
         style="display: none;">

        <h2 id="tituloFormularioPerfil" class="titulo-perfil text-center">

            Editar información

        </h2>

        <form id="formEditarPerfil">

            <!-- Solicita el nombre del usuario. -->

            <div class="mb-3">

                <label for="editarNombre"
                       class="form-label">

                    Nombre

                </label>

                <input type="text"
                       id="editarNombre"
                       class="form-control"
                       required>

            </div>

            <!-- Solicita los apellidos del usuario. -->

            <div class="mb-3">

                <label for="editarApellidos"
                       class="form-label">

                    Apellidos

                </label>

                <input type="text"
                       id="editarApellidos"
                       class="form-control"
                       required>

            </div>

            <!-- Permite modificar el nombre de usuario. -->

            <div class="mb-3">

                <label for="editarUsuario"
                       class="form-label">

                    Usuario

                </label>

                <input type="text"
                       id="editarUsuario"
                       class="form-control"
                       required>

            </div>

            <!-- Permite modificar el correo electrónico. -->

            <div class="mb-3">

                <label for="editarCorreo"
                       class="form-label">

                    Correo

                </label>

                <input type="email"
                       id="editarCorreo"
                       class="form-control"
                       required>

            </div>

            <!-- Permite actualizar la biografía del usuario. -->

            <div class="mb-3">

                <label for="editarBiografia"
                       class="form-label">

                    Biografía

                </label>

                <textarea id="editarBiografia"
                          class="form-control"
                          rows="3"
                          required></textarea>

            </div>

            <!-- Permite modificar el número de teléfono. -->

            <div class="mb-3">

                <label for="editarTelefono"
                       class="form-label">

                    Teléfono

                </label>

                <input type="text"
                       id="editarTelefono"
                       class="form-control"
                       required>

            </div>

            <!-- Permite actualizar la ciudad de residencia. -->

            <div class="mb-3">

                <label for="editarCiudad"
                       class="form-label">

                    Ciudad

                </label>

                <input type="text"
                       id="editarCiudad"
                       class="form-control"
                       required>

            </div>

            <!-- Permite modificar el género registrado. -->

            <div class="mb-3">

                <label for="editarGenero"
                       class="form-label">

                    Género

                </label>

                <input type="text"
                       id="editarGenero"
                       class="form-control"
                       required>

            </div>

            <!-- Permite actualizar la fecha de nacimiento. -->

            <div class="mb-3">

                <label for="editarFechaNacimiento"
                       class="form-label">

                    Fecha de nacimiento

                </label>

                <input type="date"
                       id="editarFechaNacimiento"
                       class="form-control"
                       required>

            </div>

            <!-- Presenta las opciones para guardar o cancelar la edición. -->

            <div class="text-center mt-4">

                <button type="submit"
                        class="btn-guardar">

                    Guardar cambios

                </button>

                <br>
                <br>

                <button type="button"
                        id="cancelarEdicion"
                        class="btn-cancelar">

                    Cancelar

                </button>

            </div>

        </form>

    </div>

    <!-- Agrupa las acciones disponibles para gestionar la cuenta. -->

    <div id="accionesUsuario"
         class="d-flex flex-column align-items-center gap-2 acciones-perfil">

        <!-- Permite editar la información del usuario. -->

        <button type="button"
                id="editarInformacion"
                class="btn-perfil">

            Editar información

        </button>

        <!-- Permite agregar información cuando está disponible la opción. -->

        <button type="button"
                id="agregarInformacion"
                class="btn-perfil"
                hidden>

            Agregar información

        </button>

        <!-- Dirige a la sección de mascotas registradas. -->

        <a href="../Modulo_2_gestion_mascotas/mis_mascotas.html"
           id="verMascotas"
           class="btn-perfil">

            Ver mis mascotas

        </a>

        <!-- Dirige a la página para cambiar la contraseña. -->

        <a href="recu_contrasena.html"
           class="enlace-perfil">

            Cambiar contraseña

        </a>

        <!-- Dirige a la página de inicio de sesión para cerrar la sesión. -->

        <a href="iniciar_sesion.html"
           id="cerrarSesion"
           class="enlace-perfil">

            Cerrar sesión

        </a>

    </div>

    <!-- Carga la lógica para consultar y actualizar los datos del usuario. -->

    <script src="/JS/usuario.js"></script>

    <!-- Carga la configuración global de My Pet. -->

    <script src="/JS/configuracion_global.js"></script>

</body>

</html>
