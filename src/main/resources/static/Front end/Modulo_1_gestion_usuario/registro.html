<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Carga el cliente de conexión con la API. -->

    <script src="/JS/api-client.js"></script>

    <!-- Configura el documento y su adaptación a dispositivos móviles. -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Carga Bootstrap para utilizar sus estilos y componentes. -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Regístrate</title>

    <!-- Carga los estilos generales de My Pet. -->

    <link rel="stylesheet" href="../mi_pet.css">
</head>

<body class="fondo_pata">

    <!-- Permite regresar a la página de inicio. -->

    <header>
        <a class="flecha" href="mi_pet.html">←</a>
    </header>

    <article>
        <div>

            <!-- Agrupa los campos del formulario de registro. -->

            <form id="formRegistro">

                <div class="registrate">

                    <!-- Solicita el nombre del usuario. -->

                    <h2>Nombre</h2>
                    <input type="text" id="nombre" required>

                    <!-- Solicita los apellidos del usuario. -->

                    <h2>Apellidos</h2>
                    <input type="text" id="apellidos" required>

                    <!-- Solicita el nombre de usuario para la cuenta. -->

                    <h2>Nombre de Usuario</h2>
                    <input type="text" id="usuario" required>

                    <!-- Solicita el correo electrónico del usuario. -->

                    <h2>Correo</h2>
                    <input type="email" id="correo" required>

                    <!-- Solicita la contraseña de la cuenta. -->

                    <h2>Contraseña</h2>
                    <input type="password" id="contrasena" required>

                    <!-- Muestra los mensajes del proceso de registro. -->

                    <p id="mensajeRegistro" role="alert" aria-live="polite"></p>

                </div>

                <!-- Presenta el botón para enviar el formulario. -->

                <div class="padre-naranja">
                    <button type="submit" id="btnRegistrar" class="boton-naranja">
                        Registrarse
                    </button>
                </div>

            </form>

        </div>
    </article>

    <!-- Carga la lógica del registro de usuarios. -->

    <script src="/JS/Registro.js"></script>

    <!-- Carga la configuración global de My Pet. -->

    <script src="/JS/configuracion_global.js"></script>

</body>

</html>
