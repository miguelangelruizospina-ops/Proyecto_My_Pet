<!DOCTYPE html>
<html lang="es">
<head>
    <script src="/JS/api-client.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Regístrate</title>

   <link rel="stylesheet" href="../mi_pet.css">
</head>

<body class="fondo_pata">

    <header>
        <a class="flecha" href="mi_pet.html">←</a>
    </header>

    <article>
        <div>

            <form id="formRegistro">

                <div class="registrate">

                    <h2>Nombre</h2>
                    <input type="text" id="nombre" required>

                    <h2>Apellidos</h2>
                    <input type="text" id="apellidos" required>

                    <h2>Nombre de Usuario</h2>
                    <input type="text" id="usuario" required>

                    <h2>Correo</h2>
                    <input type="email" id="correo" required>

                    <h2>Contraseña</h2>
                    <input type="password" id="contrasena" required>

                    <p id="mensajeRegistro" role="alert" aria-live="polite"></p>

                </div>

                <div class="padre-naranja">
                    <button type="submit" id="btnRegistrar" class="boton-naranja">
                        Registrarse
                    </button>
                </div>

            </form>

        </div>
    </article>

    <!-- JavaScript del registro -->
    <script src="/JS/Registro.js"></script>
    <script src="/JS/configuracion_global.js"></script>

</body>
</html>
