# Nombre de la aplicación.

spring.application.name=My-Pet

# Configura el puerto utilizado por el servidor para evitar conflictos con otros proyectos.

server.port=8082

# Configuración de la conexión con la base de datos MySQL.

spring.datasource.url=jdbc:mysql://localhost:3306/mypet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Configuración de Hibernate para actualizar automáticamente la estructura de la base de datos.

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL ejecutadas por Hibernate durante el funcionamiento de la aplicación.

spring.jpa.show-sql=true

# Activa los registros detallados de las solicitudes procesadas por Spring Web.

logging.level.org.springframework.web=DEBUG